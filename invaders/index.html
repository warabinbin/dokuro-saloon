<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<div class="stage" id="stage"><div id="chips"></div><canvas id="cv"></canvas><div id="ov" class="ov"></div><div id="strip"></div></div>
<script>
(()=>{
const W=360;let H=600;
const COLS=['#f0a63a','#4aa3d8','#5fae7a','#e0553a','#c78bff','#f3e9dc','#ffd23f','#7bd0c1'],ROWC=['#e0553a','#f0a63a','#5fae7a','#4aa3d8','#c78bff'];
const cv=document.getElementById('cv'),ov=document.getElementById('ov'),chipsEl=document.getElementById('chips'),stripEl=document.getElementById('strip'),stage=document.getElementById('stage'),ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
let G=null,raf=0,lastT=0,N=3,ac=null,master=null,ROOM=null,bg=null,fitVs=false;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const S={mute:LS.get('dk_mute')==='1',vib:LS.get('dk_vib')!=='0',rel:LS.get('dk_rel')==='1',seen:LS.get('dk_seen')==='1'};
const calm=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const keys={};
/* ---- link with ドクロ酒場 (same origin: names come from its saved night, results go back to it) ---- */
const FROM=new URLSearchParams(location.search).get('from')==='bar';
let ROSTER=null;
try{if(FROM){const o=JSON.parse(localStorage.getItem('dk_state')||'null');if(o&&o.players&&o.players.length)ROSTER=o.players.slice(0,8).map(p=>String(p.name||'').slice(0,8))}}catch(e){}
const INFRAME=(()=>{try{return window.top!==window}catch(e){return true}})();
const home=(q='')=>INFRAME?'https://warabinbin.github.io/dokuro-saloon/'+q:'../'+q;
const aHome=(label,q,cls)=>`<a class="btn ${cls||''}" href="${home(q)}"${INFRAME?' target="_blank" rel="noopener"':''}>${label}</a>`;
const pname=i=>(ROSTER&&ROSTER[i])||'P'+(i+1);
const short=(t,c)=>{const m=c<70?3:6;return t.length>m?t.slice(0,m):t};
if(ROSTER)N=Math.max(1,Math.min(8,ROSTER.length));
const shade=(h,f)=>{const n=parseInt(h.slice(1),16);return`rgb(${Math.min(255,(n>>16&255)*f|0)},${Math.min(255,(n>>8&255)*f|0)},${Math.min(255,(n&255)*f|0)})`};

/* ================= ships ================= */
const SHIPS=[
 {id:'falcon',n:'ファルコン',d:'万能型。必殺「ノヴァ」で敵を一掃',cd:.36,spd:360,sp:'nova'},
 {id:'striker',n:'ストライカー',d:'高速連射。必殺「スコール」で弾幕',cd:.22,spd:440,sp:'squall'},
 {id:'lancer',n:'ランサー',d:'貫通弾。必殺「ブレイカー」で薙ぎ払う',cd:.55,spd:330,sp:'beam'},
 {id:'guardian',n:'ガーディアン',d:'二連装。必殺「バリア」で弾を跳ね返す',cd:.46,spd:300,sp:'barrier'}];
const SHAPES=[
 {body:[[0,-20],[3.2,-9],[5,3],[4.2,11],[0,13]],wing:[[0,-3],[6,-1],[21,10],[23,15],[16,14],[7,9],[0,9]],can:[[0,-11],[8,-6],[10,-3.5],[3.5,-4],[0,-4]],eng:[-4.5,4.5],cock:[0,-6,2.4,5.5],fl:11,w:24},
 {body:[[0,-17],[4.5,-7],[5.5,7],[0,11]],wing:[[0,0],[8,-9],[17,-5],[20,9],[11,7],[0,8]],guns:[-9,9],eng:[0],cock:[0,-5,2.4,4.5],fl:14,w:21},
 {body:[[0,-27],[2.4,-13],[4,5],[3,13],[0,15]],wing:[[0,3],[10,9],[14,17],[7,13],[0,12]],tip:true,eng:[0],cock:[0,-8,1.8,6],fl:15,w:15},
 {body:[[0,-15],[7,-9],[9.5,5],[5.5,12],[0,14]],wing:[[0,-6],[14,-5],[20,3],[19,12],[9,10],[0,9]],core:true,eng:[-6,6],cock:[0,-7,2.4,4],fl:10,w:21}];
let PICK=[0,1,2,3,0,1,2,3],VSHIP=0;
try{const a=JSON.parse(LS.get('dk_ships')||'null');if(Array.isArray(a)&&a.length>=8)PICK=a.map(x=>clamp(x|0,0,3));VSHIP=clamp(LS.get('dk_ship')|0,0,3)}catch(e){}
function poly(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);for(let i=p.length-2;i>=1;i--)c.lineTo(-p[i][0],p[i][1]);c.closePath()}
function metal(c,col,w){const g=c.createLinearGradient(-w,0,w,0);g.addColorStop(0,shade(col,.55));g.addColorStop(.5,shade(col,1.35));g.addColorStop(1,shade(col,.55));c.fillStyle=g}
/* the hull is drawn once per (type,colour) into a small canvas; per frame only the flame and blinking lights are drawn */
function shipBody(c,ty,col){
  const Sh=SHAPES[ty];
  c.globalAlpha=.15;c.fillStyle=col;c.beginPath();c.arc(0,2,25,0,7);c.fill();c.globalAlpha=1;
  c.lineWidth=1;c.strokeStyle='rgba(0,0,0,.45)';
  metal(c,col,Sh.w);poly(c,Sh.wing);c.fill();c.stroke();
  if(Sh.can){c.fillStyle=shade(col,.8);poly(c,Sh.can);c.fill()}
  if(Sh.guns){c.fillStyle='#2a2320';Sh.guns.forEach(gx=>c.fillRect(gx-1.4,-15,2.8,11));c.fillStyle='#ffd23f';Sh.guns.forEach(gx=>c.fillRect(gx-.8,-16,1.6,2))}
  metal(c,col,8);poly(c,Sh.body);c.fill();c.stroke();
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=.9;c.beginPath();
  const w1=Sh.wing[1],w2=Sh.wing[2];c.moveTo(w1[0],w1[1]);c.lineTo(w2[0],w2[1]);c.moveTo(-w1[0],w1[1]);c.lineTo(-w2[0],w2[1]);c.stroke();
  const[cx,cy,rx,ry]=Sh.cock,gc=c.createLinearGradient(0,cy-ry,0,cy+ry);gc.addColorStop(0,'#d4f6ff');gc.addColorStop(1,'#2a6d94');c.fillStyle=gc;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.7)';c.fillRect(cx-.6,cy-ry+1,1.2,ry*.8);
  if(Sh.core){const g2=c.createRadialGradient(0,3,0,0,3,7);g2.addColorStop(0,'#fff3b0');g2.addColorStop(1,'rgba(255,140,40,0)');c.fillStyle=g2;c.beginPath();c.arc(0,3,7,0,7);c.fill()}
  if(Sh.tip){c.globalCompositeOperation='lighter';const g3=c.createRadialGradient(0,-27,0,0,-27,9);g3.addColorStop(0,'rgba(150,240,255,.95)');g3.addColorStop(1,'rgba(150,240,255,0)');c.fillStyle=g3;c.beginPath();c.arc(0,-27,9,0,7);c.fill();c.globalCompositeOperation='source-over'}
}
function shipLights(c,ty,t){const wt=SHAPES[ty].wing[3],on=Math.sin(t*6)>0;c.fillStyle=on?'#ff6a5c':'#7a2a24';c.fillRect(-wt[0]-1,wt[1]-1,2,2);c.fillStyle=on?'#5cff9a':'#245a3a';c.fillRect(wt[0]-1,wt[1]-1,2,2)}
/* full-quality flame (gradients) for the few ships shown in menus */
function shipFlameFull(c,ty,t){
  const Sh=SHAPES[ty];c.globalCompositeOperation='lighter';
  Sh.eng.forEach(ex=>{const fl=Sh.fl+Math.sin(t*38+ex)*3,g=c.createLinearGradient(0,12,0,12+fl);g.addColorStop(0,'rgba(255,230,140,.95)');g.addColorStop(1,'rgba(255,90,40,0)');c.fillStyle=g;c.beginPath();c.moveTo(ex-3,12);c.lineTo(ex+3,12);c.lineTo(ex,12+fl);c.closePath();c.fill();
    const gl=c.createRadialGradient(ex,12,0,ex,12,10);gl.addColorStop(0,'rgba(130,210,255,.6)');gl.addColorStop(1,'rgba(130,210,255,0)');c.fillStyle=gl;c.beginPath();c.arc(ex,12,10,0,7);c.fill()});
  c.globalCompositeOperation='source-over';
}
/* cheap flame for in-game ships: flat triangles, no gradients */
function shipFlameFast(c,ty,t){
  const Sh=SHAPES[ty];c.globalCompositeOperation='lighter';
  Sh.eng.forEach(ex=>{const fl=Sh.fl+Math.sin(t*38+ex)*3;
    c.fillStyle='rgba(255,215,120,.9)';c.beginPath();c.moveTo(ex-3,12);c.lineTo(ex+3,12);c.lineTo(ex,12+fl);c.closePath();c.fill();
    c.fillStyle='rgba(255,110,50,.55)';c.beginPath();c.moveTo(ex-1.5,12);c.lineTo(ex+1.5,12);c.lineTo(ex,12+fl*1.35);c.closePath();c.fill();
    c.fillStyle='rgba(130,210,255,.3)';c.beginPath();c.arc(ex,12,6,0,7);c.fill()});
  c.globalCompositeOperation='source-over';
}
const SPR={};
function spriteFor(ty,col){
  const k=ty+col;if(SPR[k])return SPR[k];
  const c=document.createElement('canvas');c.width=64*dpr;c.height=64*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);x.translate(32,34);shipBody(x,ty,col);
  return SPR[k]=c;
}
function shipDraw(c,x,y,ty,col,t,tilt,flame){
  c.save();c.translate(x,y);c.rotate(tilt);
  if(flame)shipFlameFull(c,ty,t);
  shipBody(c,ty,col);shipLights(c,ty,t);
  c.restore();
}
function shipFast(s,t){
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.tilt);
  shipFlameFast(ctx,s.ty,t);
  ctx.drawImage(spriteFor(s.ty,COLS[s.p]),-32,-34,64,64);
  shipLights(ctx,s.ty,t);
  ctx.restore();
}

/* ================= audio ================= */
function ensureAc(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;ac=new A();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f1,f2,ms,type,vol,delay=0){
  if(S.mute||!ensureAc())return;
  try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+ms/1000);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);o.connect(g);g.connect(master);o.start(t);o.stop(t+ms/1000+.02)}catch(e){}
}
function noise(ms,vol,lp){
  if(S.mute||!ensureAc())return;
  try{const n=ac.sampleRate*ms/1000|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=lp;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start()}catch(e){}
}
let lastShoot=0,lastGraze=0;
const SFX={
  shoot:()=>{const n=performance.now();if(n-lastShoot<110)return;lastShoot=n;tone(980,520,55,'square',.012)},
  kill:()=>{tone(320,90,110,'sawtooth',.035);noise(80,.025,2200)},
  hit:()=>{noise(240,.09,800);tone(170,50,240,'sawtooth',.06)},
  boom:()=>{noise(520,.11,500);tone(130,40,520,'sawtooth',.08)},
  pick:()=>{tone(660,990,90,'triangle',.05);tone(990,1320,120,'triangle',.05,.08)},
  warn:()=>{tone(520,520,80,'square',.03);tone(390,390,110,'square',.03,.1)},
  clear:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,130,'triangle',.05,i*.1))},
  send:()=>tone(420,980,110,'square',.025),
  shield:()=>tone(900,300,120,'triangle',.05),
  graze:()=>{const n=performance.now();if(n-lastGraze<80)return;lastGraze=n;tone(1800,2400,40,'sine',.02)},
  ready:()=>{tone(700,1400,160,'triangle',.05);tone(1400,1900,140,'triangle',.04,.12)},
  special:()=>{tone(180,900,260,'sawtooth',.06);noise(300,.08,3000)},
  boss:()=>{tone(110,110,300,'sawtooth',.06);tone(98,98,300,'sawtooth',.06,.32);tone(82,82,500,'sawtooth',.07,.64)}
};
const play=n=>{try{SFX[n]()}catch(e){}};
const vib=p=>{if(S.vib)try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ================= screen fit + background ================= */
function mkBg(){
  const c=document.createElement('canvas');c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0807');g.addColorStop(1,'#1b100b');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*.75,H*.22,0,W*.75,H*.22,W*.85);g.addColorStop(0,'rgba(240,166,58,.11)');g.addColorStop(1,'rgba(240,166,58,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*.15,H*.62,0,W*.15,H*.62,W*.75);g.addColorStop(0,'rgba(74,163,216,.08)');g.addColorStop(1,'rgba(74,163,216,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createLinearGradient(0,H-110,0,H);g.addColorStop(0,'rgba(240,166,58,0)');g.addColorStop(1,'rgba(240,166,58,.10)');x.fillStyle=g;x.fillRect(0,H-110,W,110);
  return c;
}
function avail(vs){const iw=window.innerWidth||412,ih=window.innerHeight||860,aw=Math.min(iw-32,480);return{aw,ah:Math.max(420,ih-(vs?150:34))}}
function sizeStage(){const a=avail(fitVs);stage.style.maxWidth=Math.floor(Math.min(a.aw,a.ah*W/H))+'px'}
function fit(vs){
  fitVs=vs;const a=avail(vs),h=vs?600:clamp(Math.round(W*a.ah/a.aw),520,700);

/* ================= relay fallback (no login, no server of our own) =================
   Same shape as the platform `room` (join -> peers/presence/onPeers/connected/leave).
   Each player publishes their presence as a retained message on a public MQTT broker over wss, so any network pairing works.
   Two brokers are used at once; either one alone is enough. */
function mqttRoom(){
  const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
  return{join:name=>new Promise((resolve,reject)=>{
    const id=Math.random().toString(36).slice(2,10),base='dokuro-saloon-inv/'+name+'/',state=new Map(),hs=new Set(),cs=[];
    let done=false,cur={},tp=0,failed=0,lastErr='',to=0,hb=0;
    const fire=()=>hs.forEach(h=>{try{h({})}catch(e){}});
    const push=()=>{const pl=JSON.stringify({p:cur,t:Date.now()});cs.forEach(o=>{if(o.up)try{o.m.publish(base+id,pl,{retain:true,qos:0})}catch(e){}})};
    const bad=e=>{lastErr=(e&&e.message)||String(e);if(!done&&++failed>=BROKERS.length){done=true;clearTimeout(to);reject(new Error(lastErr))}};
    const api={
      peers:()=>[...state].map(([p,x])=>({peer:p,sameTab:p===id,isMe:p===id,kind:'viewer',guest:false,presence:x.presence,updatedAt:x.upd})),
      presence:async patch=>{
        cur={...cur};for(const [k,v] of Object.entries(patch)){if(v===null)delete cur[k];else cur[k]=v}
        state.set(id,{presence:cur,upd:Date.now()});
        if(!tp)tp=setTimeout(()=>{tp=0;push()},100);
        fire();
      },
      onPeers:h=>{hs.add(h);setTimeout(()=>h({}),1);return()=>hs.delete(h)},
      connected:()=>cs.some(o=>o.up),
      leave:async()=>{clearInterval(hb);clearTimeout(tp);cs.forEach(o=>{try{o.m.publish(base+id,'',{retain:true});o.m.end(true)}catch(e){}})}
    };
    BROKERS.forEach((url,i)=>{
      const o={m:null,up:false};cs.push(o);
      try{
        const m=o.m=mqtt.connect(url,{clientId:'dk_'+id+'_'+i,clean:true,reconnectPeriod:3000,connectTimeout:8000,keepalive:20,will:{topic:base+id,payload:'',retain:true,qos:0}});
        m.on('connect',()=>{m.subscribe(base+'+',{qos:0},err=>{
          if(err)return bad(err);
          o.up=true;state.set(id,{presence:cur,upd:Date.now()});push();
          if(!done){done=true;clearTimeout(to);resolve(api)}fire()})});
        m.on('close',()=>{o.up=false;fire()});
        m.on('error',bad);
        m.on('message',(topic,buf)=>{
          const pid=topic.slice(base.length);if(pid===id)return;
          if(!buf.length){if(state.delete(pid))fire();return}
          try{const m2=JSON.parse(buf.toString());state.set(pid,{presence:m2.p||{},upd:Date.now()});fire()}catch(e){}
        });
      }catch(e){bad(e)}
    });
    to=setTimeout(()=>{if(!done){done=true;reject(new Error(lastErr||'timeout'))}},10000);
    /* keepalive + drop peers that went silent (a crashed tab leaves a retained message behind) */
    hb=setInterval(()=>{push();const now=Date.now();let ch=false;state.forEach((x,k)=>{if(k!==id&&now-x.upd>12000){state.delete(k);ch=true}});if(ch)fire()},3000);
  })};
}

/* ================= versus layer ================= */
const V={mode:null,phase:'menu',name:'',code:'',host:false,room:null,unsub:null,run:0,lastGo:0,seen:{},seenRun:{},pl:{},bots:[],target:null,ended:false,lastPub:0,lastChip:0,lastEnd:0,maxP:1};
V.name=LS.get('dk_name')||'';
const rp=patch=>V.room?V.room.presence(patch).catch(e=>{V.err=(e&&e.code)||'error'}):Promise.resolve();
const myId=()=>{if(V.mode!=='room')return'me';const m=V.room&&V.room.peers().find(p=>p.sameTab);return m?m.peer:'me'};
function plist(){
  if(V.mode==='room'&&V.room)return V.room.peers().filter(p=>p.presence&&p.presence.vs).map(p=>({id:p.peer,isMe:p.sameTab,...p.presence}));
  return Object.entries(V.pl).map(([id,p])=>({id,isMe:id==='me',...p}));
}
const inRun=()=>plist().filter(p=>p.run===V.run);
function vsTarget(){
  const rv=inRun().filter(p=>!p.isMe&&p.alive);if(!rv.length)return null;
  const t=rv.find(p=>p.id===V.target);if(t)return t.id;
  return rv.reduce((a,b)=>(b.score||0)>(a.score||0)?b:a).id;
}
/* outgoing attacks first cancel what is still queued against you, the rest goes to the target */
function vsSend(n){
  const g=G;let r=n;const off=Math.min(g.pend,r);
  if(off){g.pend-=off;r-=off;g.cancel+=off;fxText(g.ships[0].x,g.ships[0].y-30,'相殺 -'+off,'#5fae7a')}
  const t=vsTarget();if(r>0&&t){g.out[t]=(g.out[t]||0)+r;g.sent+=r;play('send')}
}
function vsPub(force){
  if(!G||!G.vs)return;const now=performance.now();if(!force&&now-V.lastPub<200)return;V.lastPub=now;
  const s=G.ships[0],st={vs:1,name:V.name,run:V.run,sh:s.ty,lives:s.lives,alive:s.alive,diedAt:s.alive?null:G.diedAt,score:G.score,en:G.en.length+G.dv.length,wave:G.wave,out:G.out};
  if(V.mode==='room'&&V.room)rp(st);else Object.assign(V.pl.me||(V.pl.me={}),st);
}
function vsRecv(){
  let d=0;
  for(const p of inRun()){if(p.isMe)continue;const v=(p.out&&p.out[myId()])||0,sn=V.seen[p.id]||0;if(v>sn){d+=v-sn;V.seen[p.id]=v}}
  if(d){G.pend+=d;G.recv+=d;say(`来襲 +${d}`,'#ff7a5c')}
}
function botTick(dt){
  const t=(Date.now()-V.run)/1000;
  for(const b of V.bots){
    const p=V.pl[b.id];if(!p.alive)continue;
    p.score+=dt*(8+b.skill*6);p.en=8+((t/9)|0)%6;
    for(const [id,q] of Object.entries(V.pl)){if(id===b.id)continue;const v=(q.out&&q.out[b.id])||0,sn=b.seen[id]||0;if(v>sn){b.hp-=v-sn;b.seen[id]=v}}
    p.lives=clamp(Math.ceil(b.hp/(b.hp0/3)),0,3);
    if(b.hp<=0){p.alive=false;p.diedAt=Date.now()-V.run;continue}
    b.acc+=dt*(.10+.06*b.skill)*(1+t/80);
    while(b.acc>=1){b.acc-=1;const c=Object.entries(V.pl).filter(([id,q])=>id!==b.id&&q.alive);if(c.length){const [id]=pick(c);p.out[id]=(p.out[id]||0)+1}}
  }
}
const heart=n=>'♥'.repeat(Math.max(0,n))+'♡'.repeat(Math.max(0,3-n));
function renderChips(){
  if(!G||!G.vs||V.phase!=='play'&&V.phase!=='result'){chipsEl.innerHTML='';stripEl.innerHTML='';return}
  const tg=vsTarget(),ps=inRun(),tn=ps.find(p=>p.id===tg);
  chipsEl.innerHTML=ps.map(p=>`<button class="chip ${p.isMe?'me':''} ${p.alive?'':'dead'} ${p.id===tg?'tg':''}" data-id="${esc(p.id)}">${esc(p.isMe?'あなた':(p.name||'?'))} <span class=muted>${esc(SHIPS[p.sh|0]?SHIPS[p.sh|0].n.slice(0,2):'')}</span><br>${heart(p.lives||0)} 敵${p.en|0}<br>${p.score|0}点</button>`).join('');
  stripEl.innerHTML=`<span>狙い: <b class=hl>${tn?esc(tn.name||'?'):'なし'}</b>${V.target?'(固定)':'(自動)'}</span><span>送信 ${G.sent} / 受信 ${G.recv} / 相殺 ${G.cancel}</span>`;
}
function vsTick(dt){
  if(!G.vs||V.phase!=='play')return;
  if(V.mode==='cpu')botTick(dt);
  if(G.state==='play')vsRecv();
  vsPub();
  const now=performance.now();
  if(now-V.lastChip>300){V.lastChip=now;renderChips()}
  if(now-V.lastEnd>500){V.lastEnd=now;vsCheckEnd()}
}
function vsCheckEnd(){
  if(V.ended)return;
  const ps=inRun(),now=Date.now();
  ps.forEach(p=>{V.seenRun[p.id]={alive:!!p.alive,t:now}});
  /* ponytail: a rival missing from the list (network blip) still counts as alive for 15s, so a hiccup never hands out a false win */
  const ids=Object.keys(V.seenRun);V.maxP=Math.max(V.maxP,ids.length);
  const aliveN=ids.filter(id=>{const x=V.seenRun[id];return ps.some(p=>p.id===id)?x.alive:(x.alive&&now-x.t<15000)}).length;
  if(V.maxP>=2&&aliveN<=1&&!(G.state==='intro'&&G.wave===1&&G.t<2))vsEnd();
}
function vsEnd(){
  V.ended=true;V.phase='result';G.state='over';vsPub(true);
  const rk=inRun().sort((a,b)=>(b.alive?1e15:b.diedAt||0)-(a.alive?1e15:a.diedAt||0));
  const n=rk.length,me=rk.findIndex(p=>p.isMe),nm=p=>esc(p.isMe?'あなた':(p.name||'?'));

  const win=me===0;if(win)play('clear');
  ov.innerHTML=`<p class=k>RESULT</p><h2>${win?'あなたの勝ち!':`${me+1}位`}</h2>
  <div class=card>${rk.map((p,i)=>`<div class=pl><span>${i+1}. ${nm(p)}</span><span>${p.score|0}点 / WAVE ${p.wave||1}</span></div>`).join('')}</div>
  <div class=card><div class=pl><span>撃破</span><span>${G.ships[0].kills}</span></div><div class=pl><span>送った敵 / 受けた敵</span><span>${G.sent} / ${G.recv}</span></div><div class=pl><span>相殺 / グレイズ</span><span>${G.cancel} / ${G.grazes}</span></div></div>
  <p class=muted>${n>=2?`1位(${nm(rk[0])})は誰か1人を指名。最下位(${nm(rk[n-1])})はふた口${n>=3?`、下から2番目(${nm(rk[n-2])})はひと口`:''}。`:''}</p>
  ${V.mode==='cpu'||V.host?'<button data-a="again">もう一回</button>':'<p class=muted>ホストが「もう一回」を押すと始まります。</p>'}
  <button class="alt" data-a="vsmenu">対戦メニューへ</button>`;
}
function startVS(run){
  V.lobbyHtml='';V.run=run;V.lastGo=run;V.phase='play';V.seen={};V.seenRun={};V.ended=false;V.maxP=1;V.lastEnd=performance.now();
  start(1,true);G.out={};
  if(V.mode==='room'&&V.room)rp({vs:1,name:V.name,run,sh:VSHIP,out:{},alive:true,lives:3,diedAt:null,score:0,en:0,wave:1});

function startCpu(k){

  for(let i=1;i<=k;i++){const id='bot'+i,skill=Math.random();V.bots.push({id,skill,hp:22,hp0:22,acc:0,seen:{}});V.pl[id]={vs:1,name:'CPU'+i,run:0,sh:i%4,lives:3,alive:true,score:0,en:8,wave:1,out:{}}}

async function leaveRoom(){
  V.lobbyHtml='';try{V.unsub&&V.unsub()}catch(e){}V.unsub=null;clearInterval(V.poll);V.poll=0;V.err='';
  try{V.room&&await V.room.leave()}catch(e){}

  if(go&&go!==V.lastGo&&(manual||go!==V.baseGo))startVS(go);

/* ================= game core ================= */
function start(n,vs=false){
  ensureAc();fit(vs);
  const c=W/n;
  G={n,c,vs,ships:Array.from({length:n},(_,p)=>({p,ty:vs?VSHIP:PICK[p],x:c*p+c/2,tx:c*p+c/2,y:H-72,lives:3,alive:true,inv:0,cd:rand(0,.3),kills:0,hits:0,rapid:0,tri:0,shield:0,tilt:0,sp:0,ready:false,refl:0,spd:SHIPS[vs?VSHIP:PICK[p]].spd})),
    bul:[],eb:[],en:[],dv:[],it:[],pt:[],rings:[],fx:[],tele:[],beams:[],stars:mkStars(),
    wave:0,score:0,state:'intro',timer:1.6,dir:1,fire:1.2,msg:[],t:0,total:1,atk:0,out:{},pend:0,pendT:0,diedAt:null,
    sent:0,recv:0,cancel:0,combo:0,comboT:0,shake:0,flash:0,paused:false,swT:3,grazes:0,boss:null};
  ov.style.display='none';ov.innerHTML='';

  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}

/* formation shapes, one per wave */
function layout(cols,rows,wave){
  const mid=(cols-1)/2,pat=wave%5,all=[],out=[];
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    all.push([k,r]);
    const ok=pat===1?Math.abs(k-mid)<=r*1.1+.6:pat===2?Math.abs(k-mid)<=Math.min(r,rows-1-r)*1.1+1.6:pat===3?(k+r)%2===0:pat===4?Math.abs(k-mid)>=1:true;
    if(ok)out.push([k,r]);
  }
  return out.length>=6?out:all;
}
function nextWave(){
  const g=G;g.wave++;g.state='intro';g.timer=g.wave===1&&!S.seen?3.2:1.6;g.en=[];g.eb=[];g.bul=[];g.beams=[];g.dir=1;g.swT=3;
  g.ships.forEach(s=>{if(g.wave>1&&s.alive){s.lives=Math.min(3,s.lives+(g.vs?0:1))}if(g.wave>1&&!s.alive&&!g.vs){s.alive=true;s.lives=1}s.inv=1.5});
  if(g.wave%3===0){const kind=(g.wave/3-1)%3,hp=(g.vs?18:30*g.n)+10*g.wave;g.boss={boss:1,kind,x:W/2,y:96,w:100,h:64,hp,max:hp,vx:60,ft:1,sw:0,sa:0};g.en.push(g.boss);g.total=1;play('boss')}
  else{
    g.boss=null;
    const cols=Math.min(10,4+g.n),rows=Math.min(5,(g.n===1&&!g.vs?2:3)+(g.wave>3?1:0)+(g.wave>6?1:0)),hp=Math.round((2+Math.floor((g.wave-1)/2))*(0.5+0.65*g.n));
    layout(cols,rows,g.wave).forEach(([k,r])=>{
      const x=(W-(cols-1)*30)/2+k*30,y=78+r*30,rr=g.wave>=2?Math.random():1,tp=rr<Math.min(.25,.06+.02*g.wave)?'t':rr<Math.min(.25,.06+.02*g.wave)+.09?'s':'n',base=hp+(r===0?1:0),h2=tp==='t'?base*2:base;
      g.en.push({x,y,w:24,h:24,hp:h2,max:h2,row:r,ty:tp,mode:'form'});
    });
    g.total=g.en.length}
}
function boom(x,y,col,k=8){for(let i=0;i<k;i++){const a=rand(0,6.283),v=rand(40,140);if(G.pt.length<260)G.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rand(.35,.8),m:.8,c:col,s:rand(2,4)})}}

function hitShip(s){
  if(!s.alive||s.inv>0)return;
  if(s.shield>0){s.shield=0;s.inv=.6;play('shield');ring(s.x,s.y,'#5fae7a',30);return}
  s.lives--;s.hits++;s.inv=1.6;boom(s.x,s.y,COLS[s.p],16);ring(s.x,s.y,'#e0553a',44);play('hit');shake(8);G.flash=.35;G.combo=0;

    if(G.vs){G.diedAt=Date.now()-V.run;G.state='out';vsPub(true);ov.style.display='flex';ov.style.setProperty('--ovtop','34%');ov.innerHTML=`<h2>脱落</h2><p class=muted>他の人の決着を待っています。</p>`}

function addSp(s,v){if(!s.alive||s.ready)return;s.sp=Math.min(100,s.sp+v);if(s.sp>=100){s.ready=true;play('ready');fxText(s.x,s.y-34,'必殺 READY!','#ffd23f');vib(40)}}
function onKill(e,own){

  g.combo=g.comboT>0?g.combo+1:1;g.comboT=1.3;

  const pr=g.state==='play'&&g.total?clamp(g.en.length/g.total,0,1):1;
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(10,28,W-20,3);ctx.fillStyle='#f0a63a';ctx.fillRect(10,28,(W-20)*pr,3);
  if(g.vs){const inc=g.pend+g.tele.length;if(inc>0){ctx.textAlign='left';ctx.fillStyle='#ff7a5c';ctx.font='700 13px sans-serif';ctx.fillText('来襲 '+inc,10,46)}}
  if(g.comboT>0&&g.combo>=3){ctx.textAlign='center';ctx.fillStyle='#ffd23f';ctx.font='700 14px sans-serif';ctx.fillText('COMBO '+g.combo+(g.combo>4?'  ×'+Math.min(5,1+((g.combo-1)>>2)):''),W/2,20)}
  ctx.textAlign='center';
  g.msg.forEach((m,i)=>{ctx.globalAlpha=clamp(m.t,0,1);ctx.fillStyle=m.col;ctx.font='700 14px sans-serif';ctx.fillText(m.text,W/2,64+i*18)});ctx.globalAlpha=1;
  if(g.state==='intro'){
    const e=Math.min(1,(1.6-Math.min(1.6,g.timer))/.35),boss=g.wave%3===0;
    ctx.save();ctx.translate(W/2,H/2-30);ctx.scale(1+(1-e)*.7,1+(1-e)*.7);ctx.globalAlpha=Math.min(1,e*1.4);
    ctx.fillStyle=boss?'#e0553a':'#f0a63a';ctx.font='400 38px "Dela Gothic One",sans-serif';ctx.fillText(boss?'WARNING':'WAVE '+g.wave,0,0);
    if(boss){ctx.font='700 14px sans-serif';ctx.fillStyle='#f3e9dc';ctx.fillText('巨大ドクロ接近',0,26)}
    ctx.restore();
    if(g.wave===1&&!S.seen){ctx.fillStyle='rgba(243,233,220,.9)';ctx.font='700 14px sans-serif';
      const L=g.vs?['指をスライドして動く','弾は自動で発射','ゲージが満タンでタップ=必殺技','倒した分だけ相手へ送られる']:['自分の列を指でなぞって動く','弾は自動で発射','ゲージが満タンでタップ=必殺技','被弾したらひと口'];
      L.forEach((l,i)=>ctx.fillText(l,W/2,H/2+30+i*22))}
  }
  g.ships.forEach(s=>{
    const cx=g.c*s.p+g.c/2,bw=Math.min(34,g.c-10);ctx.textAlign='center';
    ctx.fillStyle='#3a2d24';ctx.fillRect(cx-bw/2,H-27,bw,4);
    ctx.fillStyle=s.ready?(((t*6)|0)%2?'#ffd23f':'#fff3b0'):COLS[s.p];ctx.fillRect(cx-bw/2,H-27,bw*s.sp/100,4);
    for(let k=0;k<3;k++){ctx.fillStyle=k<s.lives?COLS[s.p]:'#3a2d24';ctx.beginPath();ctx.arc(cx-9+k*9,H-17,3.2,0,7);ctx.fill()}
    ctx.fillStyle=s.alive?COLS[s.p]:'#5a4a40';ctx.font='700 11px sans-serif';ctx.fillText(g.vs?'あなた':short(pname(s.p),g.c),cx,H-5);
    if(s.ready&&s.alive){ctx.fillStyle='#ffd23f';ctx.font='700 11px sans-serif';ctx.fillText('TAP!',cx,H-34)}
    if(s.rapid>0||s.tri>0){ctx.fillStyle='#ffd23f';ctx.fillRect(cx-bw/2,H-30,bw*Math.min(1,Math.max(s.rapid,s.tri)/8),1.5)}});
}

/* ---- menu backdrop (attract mode) + animated ship previews ---- */
const AT={t:0,stars:null,sk:Array.from({length:18},(_,i)=>({x:70+(i%6)*44,y:110+((i/6)|0)*40,row:(i/6)|0}))};
let PVS=[];
function bindPreviews(){PVS=ov.querySelectorAll?[...ov.querySelectorAll('canvas.pv')].map(c=>{const x=c.getContext('2d');c.width=72*dpr;c.height=72*dpr;x.setTransform(dpr,0,0,dpr,0,0);return{c,x,ty:+c.dataset.ty,col:COLS[+c.dataset.p||0]}}):[]}
function drawPreviews(t){PVS.forEach(p=>{if(p.c.isConnected===false)return;p.x.clearRect(0,0,72,72);p.x.save();p.x.translate(36,38);p.x.scale(1.2,1.2);shipDraw(p.x,0,0,p.ty,p.col,t,Math.sin(t*1.5)*.15,true);p.x.restore()})}
function attract(dt){
  AT.t+=dt;if(!AT.stars)AT.stars=mkStars();if(!bg)fit(false);
  ctx.drawImage(bg,0,0,W,H);drawStars(AT.stars,dt);
  const sw=Math.sin(AT.t*.6)*28;
  AT.sk.forEach(k=>skull(k.x+sw,k.y,24,24,ROWC[k.row%5],false,AT.t));
  const sx=W/2+Math.sin(AT.t*.9)*90;shipDraw(ctx,sx,H-90,PICK[0],COLS[0],AT.t,Math.cos(AT.t*.9)*.2,true);
  if(((AT.t*2.6)|0)%2===0){ctx.fillStyle=COLS[0];ctx.fillRect(sx-1.5,H-125-((AT.t*300)%200),3,12)}
  drawPreviews(AT.t);
}
function loop(now){
  const dt=Math.min(.033,(now-lastT)/1000);lastT=now;
  if(!G){attract(dt)}
  else{if(!G.paused&&G.state!=='over')update(dt);if(G.vs)vsTick(dt);draw()}
  raf=requestAnimationFrame(loop);
}

/* ================= menus ================= */
function toggles(){return`<div class=row><button class="alt sm" data-a="snd">音 ${S.mute?'OFF':'ON'}</button><button class="alt sm" data-a="vibt">振動 ${S.vib?'ON':'OFF'}</button><button class="alt sm" data-a="ctl">操作:${S.rel?'ずらし':'追従'}</button></div>`}
function showMain(){
  chipsEl.innerHTML='';stripEl.innerHTML='';ov.style.setProperty('--ovtop','0px');ov.style.display='flex';
  ov.innerHTML=`<h1>ドクロ・<br>インベーダー</h1><p>侵略者を撃ち落とす、ドクロ酒場のアクション。</p>
  <button data-a="coop">みんなで協力(1台を囲む)</button>
  <button class="alt" data-a="vsmenu">対戦(1人1台)</button>
  <button class="alt" data-a="how">遊び方</button>${toggles()}
  ${ROSTER?`<p class=muted>ドクロ酒場の参加者: ${esc(ROSTER.join('、'))}</p>`:''}${aHome('← ドクロ酒場へ戻る','','alt')}`;
  bindPreviews();
}
function showHow(){
  ov.innerHTML=`<h2>遊び方</h2><ul class=how>
  <li><b class=hl>操作</b>: 指でなぞって左右に動く。弾は自動で出る。</li>
  <li><b class=hl>必殺技</b>: ゲージが満タンになったら画面をタップ。機体ごとに違う。ゲージは撃破とグレイズで貯まる。</li>
  <li><b class=hl>グレイズ</b>: 敵の弾にギリギリまで近づく(当たらない)とゲージが増える。</li>
  <li><b class=hl>協力</b>: 画面が人数ぶんの列に分かれる。自分の列をなぞる。被弾したらひと口。</li>
  <li><b class=hl>対戦</b>: 敵を倒した分だけ相手の画面に敵が降り注ぐ。赤い印が来襲の合図。送った分は先に自分への来襲を相殺する。</li>
  <li><b class=hl>コンボ</b>: 連続で倒すと倍率アップ(最大×5)。被弾で途切れる。</li>
  <li><b class=hl>アイテム</b>: R=連射 / T=3方向 / S=シールド / B=ボム / H=回復</li>
  <li><b class=hl>敵</b>: 銀=装甲 / ピンク=速射 / 隊列から急降下してくる敵に注意。3ウェーブごとにボス。</li></ul>
  <button data-a="main">戻る</button>`;
}
function showCoop(){
  const best=LS.get('dk_best_coop');
  ov.innerHTML=`<h1>みんなで協力</h1><p>スマホをテーブルの真ん中に置いて全員で囲む。自分の列を指でなぞると船が左右に動く。弾は自動発射。</p>
  <p class=k>人数</p><div class=row>${[1,2,3,4,5,6,7,8].map(n=>`<button class="alt ${n===N?'sel':''}" data-n=${n}>${n}</button>`).join('')}</div>
  <p class=k>機体(タップで変更)</p><div class=row>${Array.from({length:N},(_,i)=>`<button class="alt pvb" data-a="shipc" data-p="${i}"><canvas class="pv" data-p="${i}" data-ty="${PICK[i]}"></canvas><span style="color:${COLS[i]}">${esc(short(pname(i),99))}</span><span class=nm>${SHIPS[PICK[i]].n}</span></button>`).join('')}</div>
  <button data-a="go">出撃</button><p class=muted>被弾したらひと口。5人以上はタブレットやPCの大きい画面が遊びやすい。${best?`<br>ベスト: WAVE ${esc(best.split('/')[0])} / ${esc(best.split('/')[1])}点`:''}</p>
  <button class="alt" data-a="main">戻る</button>`;
  bindPreviews();
}
function showVsMenu(){
  chipsEl.innerHTML='';stripEl.innerHTML='';ov.style.setProperty('--ovtop','0px');ov.style.display='flex';
  ov.innerHTML=`<h1>対戦</h1><p>敵を倒した分だけ、相手の画面に敵が降り注ぐ。最後まで生き残れ。</p>
  <p class=k>名前</p><input id="nm" maxlength="8" placeholder="ニックネーム" value="${esc(V.name)}" autocomplete="off">
  <p class=k>機体</p><div class=row>${SHIPS.map((s,i)=>`<button class="alt pvb ship ${i===VSHIP?'sel':''}" data-a="vship" data-i="${i}"><canvas class="pv" data-p="0" data-ty="${i}"></canvas><span class=nm>${s.n}</span></button>`).join('')}</div>
  <p class=muted>${esc(SHIPS[VSHIP].d)}</p>
  ${ROOM?`<button data-a="mk">部屋を作る</button><div class=row><input id="cd" maxlength="4" placeholder="部屋コード" autocomplete="off" style="flex:1 1 120px"><button data-a="jn" style="flex:1 1 90px">入る</button></div>`
  :`<p class=muted>オンライン対戦は、このページを claude.ai で開くか、通信ライブラリが読み込める環境で使える。</p>`}
  <p class=k>1人で練習(CPU)</p><div class=row>${[1,2,3].map(k=>`<button class="alt" data-a="cpu" data-k=${k}>CPU ${k}体</button>`).join('')}</div>
  <button class="alt" data-a="main">戻る</button>`;
  bindPreviews();
}
function showResult(reason){
  const g=G,rk=[...g.ships].sort((a,b)=>b.kills-a.kills),mvp=rk[0],last=rk[rk.length-1];
  const prev=(LS.get('dk_best_coop')||'0/0').split('/').map(Number),isBest=g.wave>prev[0]||(g.wave===prev[0]&&g.score>prev[1]);
  if(isBest)LS.set('dk_best_coop',g.wave+'/'+g.score);
  if(ROSTER&&ROSTER.length===g.n&&!g.exported){g.exported=true;const hits=g.ships.map(s=>s.hits),lastP=g.n>1?last.p:-1;LS.set('dk_result',JSON.stringify({id:Date.now(),wave:g.wave,score:g.score,hits,last:lastP,drinks:hits.map((h,i)=>h+(i===lastP?1:0))}))}
  chipsEl.innerHTML='';stripEl.innerHTML='';ov.style.display='flex';
  ov.innerHTML=`<p class=k>GAME OVER</p><h2>${reason}</h2><p>WAVE <b class=hl>${g.wave}</b> / SCORE <b class=hl>${g.score}</b>${isBest?' <b class=hl>ベスト更新!</b>':''}</p>
  <div class=card>${rk.map(s=>`<div class=pl><span style="color:${COLS[s.p]}">${esc(pname(s.p))} ${esc(SHIPS[s.ty].n)}</span><span>撃破 ${s.kills} / 被弾 ${s.hits}</span></div>`).join('')}<div class=pl><span>グレイズ</span><span>${g.grazes}</span></div></div>
  ${g.n>1?`<p class=muted>被弾した回数ぶん、ひと口。撃破1位の ${esc(pname(mvp.p))} は誰か1人を指名。最下位の ${esc(pname(last.p))} は追加でひと口。${ROSTER&&ROSTER.length===g.n?'<br>酒場に戻ると、この結果が自動で反映される。':''}</p>`:''}
  ${ROSTER&&ROSTER.length===g.n?aHome('ドクロ酒場に戻る(結果を反映)','?back=1'):''}<button class="${ROSTER&&ROSTER.length===g.n?'alt':''}" data-a="go">もう一回</button><button class="alt" data-a="main">メニューへ</button>`;
}
function showPause(){ov.style.setProperty('--ovtop','0px');ov.style.display='flex';ov.innerHTML=`<h2>一時停止</h2><button data-a="resume">再開</button><button class="alt" data-a="main">メニューへ</button>`}
function readName(){const e=document.getElementById('nm');if(e){V.name=e.value.trim().slice(0,8);LS.set('dk_name',V.name)}if(!V.name)V.name='プレイヤー'+(10+Math.random()*89|0)}
const A={
  coop(){showCoop()}, main(){if(G&&!G.vs)G=null;showMain()}, go(){start(N)}, how(){showHow()},
  shipc(b){const p=+b.dataset.p;PICK[p]=(PICK[p]+1)%SHIPS.length;LS.set('dk_ships',JSON.stringify(PICK));showCoop()},
  vship(b){VSHIP=+b.dataset.i;LS.set('dk_ship',String(VSHIP));readName();showVsMenu()},
  snd(){S.mute=!S.mute;LS.set('dk_mute',S.mute?'1':'0');showMain()},
  vibt(){S.vib=!S.vib;LS.set('dk_vib',S.vib?'1':'0');showMain()},
  ctl(){S.rel=!S.rel;LS.set('dk_rel',S.rel?'1':'0');showMain()},
  resume(){if(G){G.paused=false;lastT=performance.now();ov.style.display='none';ov.innerHTML=''}},
  async vsmenu(){await leaveRoom();G=null;showVsMenu()},
  cpu(b){readName();startCpu(+b.dataset.k)},
  async mk(){
    readName();const sleep_=ms=>new Promise(r=>setTimeout(r,ms));
    for(let t=0;t<4;t++){
      const c=Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
      await joinRoom(c,true);if(!V.room)return;
      await sleep_(1300);
      if(!V.room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.host))return;
      await leaveRoom();
    }
  },
  async jn(){readName();const c=(document.getElementById('cd').value||'').trim().toLowerCase();if(c.length!==4)return;await joinRoom(c,false)},
  gostart(){const go=Date.now();rp({go});startVS(go)},
  force(){checkGo(true);renderLobby()},
  again(){if(V.mode==='cpu'){startCpu(V.bots.length)}else if(V.host){const go=Date.now();rp({go});startVS(go)}}
};
ov.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.n){N=+b.dataset.n;showCoop()}
  else if(b.dataset.a&&A[b.dataset.a])A[b.dataset.a](b);
});
chipsEl.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b||!G||!G.vs)return;const id=b.dataset.id;if(id===myId())return;V.target=V.target===id?null:id;renderChips()});

/* ---- input: drag to move, tap to fire the special ---- */
const ptr=new Map();
function xOf(e){const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width}
function steer(e){
  const q=ptr.get(e.pointerId);if(!q||!G)return;
  const s=G.ships[q.p];if(!s)return;
  const x=xOf(e),lo=q.p*G.c+12,hi=(q.p+1)*G.c-12;
  if(Math.abs(x-q.x0)>10)q.moved=true;
  s.tx=clamp(S.rel?q.sx+(x-q.x0)*1.3:x,lo,hi);
}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.state==='over'||G.state==='out'||G.paused)return;
  ensureAc();const x=xOf(e),p=clamp(Math.floor(x/(W/G.n)),0,G.n-1);
  ptr.set(e.pointerId,{p,x0:x,sx:G.ships[p].x,t0:performance.now(),moved:false});try{cv.setPointerCapture(e.pointerId)}catch(_){}steer(e);
});
cv.addEventListener('pointermove',steer);
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{
  const q=ptr.get(e.pointerId);ptr.delete(e.pointerId);
  if(t==='pointerup'&&q&&G&&!q.moved&&performance.now()-q.t0<260){const s=G.ships[q.p];if(s)fireSpecial(s)}
}));
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.key]=true});addEventListener('keyup',e=>{keys[e.key]=false});
addEventListener('resize',()=>{if(bg)sizeStage()});
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.vs&&G.state!=='over'&&!G.paused){G.paused=true;showPause()}});

window.__inv={start,update,draw,startCpu,vsTick,A,V,plist,fit,S,SHIPS,fireSpecial,PICK,get G(){return G},get H(){return H},steer:(p,x)=>{ptr.set(99,{p,x0:x,sx:G.ships[p].x,t0:performance.now(),moved:false});steer({pointerId:99,clientX:x})},setName:n=>{V.name=n},setShip:n=>{VSHIP=n}};
fit(false);
showMain();
lastT=performance.now();raf=requestAnimationFrame(loop);
const p2p=()=>window.mqtt?mqttRoom():null;
try{const c=window.claude;if(c&&c.use)c.use('room').then(r=>{ROOM=r||p2p()}).catch(()=>{ROOM=p2p()});else ROOM=p2p()}catch(e){ROOM=p2p()}
})();
</script>

@media (prefers-reduced-motion:no-preference){#app>*{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<div id="gbar" hidden><button class="alt sm" id="gback">← ゲーム選択に戻る</button></div>
<div id="app"></div>
<div id="modal" hidden><div class="card"><h3>ゲームを中断する?</h3><p class=muted id="mtxt"></p><div class=row><button class=red id="mok2">中断して選択に戻る</button><button class=alt id="mno">続ける</button></div></div></div>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0],clamp=(v,m=1)=>Math.max(-m,Math.min(m,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOPICS=['最近いちばん恥ずかしかったこと','人生で一番高い買い物の話','初めて一人で行った旅行','学生時代の黒歴史','拾った/落とした物の話','有名人に会った話','死にかけた体験','バイトでやらかした話','変な夢の話','一番怖かった体験'];
const EVENTS=['全員、利き手と反対の手でスマホを持つこと','最年少が1人指名して、ひと口飲ませる','全員で乾杯してから次へ','次の1ラウンド、語尾に「ござる」をつける','スマホを持つ人は立って操作する','いま一番酔ってそうな人が1人を指名して乾杯'];
const S={players:[],names:['','','',''],n:4,level:1,round:0,log:[],g:null,cb:null,raf:0,evShown:-1,ev:'',narr:-1};
const N=()=>S.players.length,nm=i=>esc(S.players[i].name);
/* unchanged screens are not rebuilt: the lobby refreshes often and a rebuild would flash and could swallow a tap */
let LASTHTML=null;
function render(html,after){if(!after&&html===LASTHTML)return;LASTHTML=after?null:html;cancelAnimationFrame(S.raf);clearTimeout(S.tmr);clearInterval(S.tmr);$('#app').innerHTML=html;const gb=$('#gbar');if(gb)gb.hidden=!(S.inGame&&(!NET.on||NET.host));scrollTo(0,0);after&&after()}
/* go = a screen for everyone, gop = a screen only player i may see/act on. Offline both just render; online the host sends them to the right phones. */
function go(html,after){if(!NET.on)return render(html,after);const aud=S.pi!=null?S.pi:'all';if(S.info)return netShowInfo(aud,html,S.info);netShow(aud,html)}
function gop(i,html,after){if(!NET.on)return render(html,after);if(S.info)return netShowInfo(i,html,S.info);netShow(i,html)}
function drink(i,k,why){const p=S.players[i];p.g=(p.g||0)+k;p.drinks+=k;S.log.push(`R${S.round+1} ${p.name}: ${why}`);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
const GMAX=5;
const DRUNK=['全員で「{n}に乾杯!」。{n}は次のゲームの間、質問に必ず本当のことを答える。','{n}はお水を1杯。かわりに全員が{n}のものまねを1回ずつ。','{n}の恥ずかしい話を1つ披露。話せなければ追加でひと口。','次のゲームの間、{n}は語尾に「にゃ」をつける。','{n}が全員にお願いを1つ言える(常識の範囲で)。','全員で「{n}ガンバレ」コール。{n}は水を飲んで復活。'];
const jug=p=>{const g=Math.min(GMAX,p.g||0),n=g/GMAX;return `<span class=jug-stack role=img aria-label="イベントゲージ ${g}/${GMAX}"><span class="jug${g>=GMAX-1?' hot':''}"><span class=jf style="height:${Math.round(n*100)}%"></span></span><span class=gauge-value>${g}/${GMAX}</span></span>${g>=GMAX-1?`<span class=hint>あと${GMAX-g}ptでイベント</span>`:''}`}
const nextBtn=(t='次へ')=>`<button data-act=cb>${t}</button>`;
function pass(i,label,next){S.cb=next;if(NET.on){S.pi=i;try{next()}finally{S.pi=null}return}go(`<p class=k>${label}</p><h2>${nm(i)}にスマホを渡して</h2><p class=muted>他の人は画面を見ない</p><button data-act=cb>私が${nm(i)}です</button>`)}

/* ---- setup ---- */
const SKULL=`<svg class="skull" viewBox="0 0 120 120" aria-hidden="true"><g class="hat"><ellipse cx="60" cy="34" rx="48" ry="9" fill="#8a4b24"/><path d="M35 34Q37 5 60 5Q83 5 85 34Z" fill="#a85d2b"/><rect x="37" y="25" width="46" height="6" fill="#3a2d24"/></g><ellipse cx="60" cy="63" rx="34" ry="30" fill="#f0a63a"/><rect x="44" y="83" width="32" height="20" rx="3" fill="#f0a63a"/><g class="eyes"><ellipse cx="47" cy="63" rx="9" ry="10" fill="#17120f"/><ellipse cx="73" cy="63" rx="9" ry="10" fill="#17120f"/></g><path d="M60 73l-5 10h10z" fill="#17120f"/><rect x="50" y="91" width="3.5" height="12" fill="#17120f"/><rect x="58.2" y="91" width="3.5" height="12" fill="#17120f"/><rect x="66.5" y="91" width="3.5" height="12" fill="#17120f"/></svg>`;
const MUG=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 18h34v36a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6z" fill="#f0a63a" stroke="#17120f" stroke-width="3"/><path d="M46 26h6a6 6 0 0 1 0 22h-6" fill="none" stroke="#f3e9dc" stroke-width="5"/><g fill="#f3e9dc"><circle cx="18" cy="16" r="8"/><circle cx="30" cy="12" r="9"/><circle cx="42" cy="16" r="8"/></g><rect x="18" y="26" width="5" height="26" rx="2.5" fill="rgba(255,255,255,.35)"/></svg>`;
const SPARK=`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0l4 14 14 6-14 6-4 14-4-14-14-6 14-6z" fill="#ffd23f"/></svg>`;
function setup(){
  S.inGame=false;
  const sv=savedInfo(),online=window.mqtt&&window.top===window;
  const bubbles=[[14,6,0],[30,9,1.1],[46,7,2.2],[62,10,.6],[78,6,1.7],[90,8,2.8]].map(([x,sz,d])=>`<i style="left:${x}%;width:${sz+4}px;height:${sz+4}px;animation-delay:${d}s"></i>`).join('');
  go(`<div class="title"><div class="scene">${bubbles}<div class="mug l">${MUG}</div>${SKULL}<div class="mug r">${MUG}</div><div class="spark">${SPARK}</div></div>
  <h1 aria-label="ドクロ酒場">${[...'ドクロ酒場'].map((ch,i)=>`<span style="animation-delay:${i*.14}s">${ch}</span>`).join('')}</h1>
  <div class="bubble">今夜はどう乾杯する?</div>
  ${sv?`<button class=alt data-act=resume>前回の夜を続ける(${sv.players.length}人 / ラウンド${sv.round+1})</button>`:''}
  ${online?`<button class="mode m1" data-act=netmenu>みんなのスマホで<small>オンライン・各自が自分のスマホで操作</small></button>`:''}
  <button class="mode m2 grn" data-act=local>1台を回して<small>テーブルの真ん中に置いて、順番に</small></button></div>`);
}
function setupLocal(){
  const inputs=Array.from({length:S.n},(_,i)=>`<input id="n${i}" maxlength=8 placeholder="プレイヤー${i+1}" value="${esc(S.names[i]||'')}">`).join('');
  go(`<p class=k>1台を回して遊ぶ</p><h2>何人で飲む?</h2>
  <div class=card><div class="row nums">${[2,3,4,5,6,7,8].map(n=>`<button class="alt ${n===S.n?'sel':''}" data-act=setn data-i=${n}>${n}</button>`).join('')}</div>${inputs}</div>
  <button data-act=start>乾杯!</button><button class=alt data-act=netback>戻る</button>`);
}
/* ---- save / resume + link to the invaders page (same origin, so localStorage is shared) ---- */
const SAVE_KEYS=['players','names','n','round','log','evShown','ev','narr','dans'];
function save(){try{const o={};SAVE_KEYS.forEach(k=>o[k]=S[k]);o.t=Date.now();localStorage.setItem('dk_state',JSON.stringify(o))}catch(e){}}
function savedInfo(){try{const o=JSON.parse(localStorage.getItem('dk_state')||'null');return o&&o.players&&o.players.length&&Date.now()-o.t<12*3600e3?o:null}catch(e){return null}}
function load(){const o=savedInfo();if(!o)return false;SAVE_KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});return true}
function importInv(){
  try{
    const r=JSON.parse(localStorage.getItem('dk_result')||'null');localStorage.removeItem('dk_result');
    if(!r||!Array.isArray(r.drinks)||r.drinks.length!==N())return;
    r.drinks.forEach((k,i)=>{if(k>0)drink(i,k,'インベーダーで'+(r.hits&&r.hits[i]?`被弾${r.hits[i]}回`:'')+(r.last===i?'(最下位)':''))});
    S.log.push(`インベーダー: WAVE ${r.wave} / ${r.score}点`);
    S.note=`WAVE ${r.wave} / ${r.score}点。`+S.players.map((p,i)=>r.drinks[i]>0?`${p.name} ×${r.drinks[i]}`:'').filter(Boolean).join('、')+' がひと口';
    save();
  }catch(e){}
}
/* online: every phone opens the invaders page inside this one (so the room connection stays alive) and joins a versus room named after the bar's room code */
function invOnline(){
  go(`<p class=k>ドクロ・インベーダー</p><h2>みんなで対戦</h2>
  <div class=card><p>全員が下のボタンを押すと、同じ対戦ルームに自動で入る。2人以上そろったら、幹事(部屋を作った人)が「対戦開始」を押す。</p>
  <p class=muted>敵を倒すと相手の画面に敵が降り注ぐ。最後に生き残った人が勝ち。結果はこの酒場には自動反映されないので、1位は誰か1人を指名・最下位は追加でひと口、を手動で。</p></div>
  <button data-act=invopen>インベーダーを開く</button>`);
}
function invOpen(){
  if(document.getElementById('invf'))return;
  let nm_='';try{nm_=localStorage.getItem('dk_name')||''}catch(e){}
  try{const me=NET.room.peers().find(x=>x.sameTab);if(me&&me.presence&&me.presence.name)nm_=me.presence.name}catch(e){}
  const q=new URLSearchParams({auto:NET.code||'',name:nm_,host:NET.host?'1':'0'}),d=document.createElement('div');
  d.id='invf';d.innerHTML=`<div class=invbar><button type=button class="alt sm" id=invx>× 酒場に戻る</button></div><iframe title="ドクロ・インベーダー" src="invaders/?${q}" allow="autoplay"></iframe>`;
  document.body.appendChild(d);document.getElementById('invx').onclick=()=>d.remove();
}
function openInv(){
  save();
  if(window.top!==window||location.protocol==='file:'){window.open('https://warabinbin.github.io/dokuro-saloon/invaders/','_blank');return}
  location.href='invaders/?from=bar';
}
function readNames(){for(let i=0;i<S.n;i++){const e=$('#n'+i);if(e)S.names[i]=e.value}}

/* ---- hub ---- */
function hub(){
  BM.stop();S.inGame=false;S.info=null;save();
  if(S.round>0&&S.round%5===0&&S.evShown!==S.round){S.evShown=S.round;S.ev=pick(EVENTS)}
  const ev=S.evShown===S.round&&S.round>0?`<div class=ev><b>ランダムイベント</b><br>${S.ev}</div>`:'';
  let dr='';S.players.forEach(p=>{if((p.g||0)>=GMAX){p.drunk=(p.drunk||0)+1;p.g=2;S.log.push(`R${S.round+1} ${p.name}: イベントゲージ満タン`);dr+=`<div class=ev><b>${esc(p.name)}のイベントゲージが満タン!</b><br>${pick(DRUNK).replace(/\{n\}/g,esc(p.name))}</div>`}});
  const note=S.note?`<div class=ev><b>インベーダーの結果</b><br>${esc(S.note)}</div>`:'';S.note='';
  go(`<p class=k>ラウンド ${S.round+1}</p>${dr}${ev}${note}
  <button class=quick-play data-act=rand><span class=qp-ic>${ICON.rand}</span><span class=qp-copy><b class=qp-title>おまかせで遊ぶ</b><small class=qp-sub>人数に合うゲームからランダムに選択</small></span><span class=qp-arrow aria-hidden=true>→</span></button>
  <div class=card>${S.players.map((p,i)=>`<div class=pl><span>${esc(p.name)}${p.drunk?`<span class=tag>イベント×${p.drunk}</span>`:''}</span><span class=gz><span class=tot title="今夜の罰ゲームポイント">罰<b>${p.drinks}</b>pt</span>${jug(p)}</span></div>${p.cards.length?`<div class=row>${p.cards.map((c,k)=>`<button class="sm grn" data-act=card data-i=${i} data-k=${k}>${c}</button>`).join('')}</div>`:''}`).join('')}</div>
  ${menu()}
  <button class="alt" data-act=end>今夜はここまで(結果)</button>`);
}
const done=()=>{S.round++;hub()};

/* ---- personal info cards (online): what each player should keep in mind, shown on their own phone only ---- */
const infoCard=(title,rows,hint)=>`<div class=card><p class=k>あなたの情報・${title}</p>${rows.map(([a,b])=>`<div class=pl><span>${a}</span><b>${b}</b></div>`).join('')}${hint?`<p class=muted>${hint}</p>`:''}</div>`;
function liarInfo(i){
  const g=S.g;if(!g||g.phase==='intro')return '';
  const j=g.ws.indexOf(i),isN=j>=0,isMad=i===g.mad,rows=[['お題',esc(g.topic)],['語り手',g.ws.map(w=>nm(w)).join(' / ')],['あなたの役',isN?'<span class=lose>語り手</span>':isMad?'<span class=lose>ペテン師</span>':'聴き手']];
  if(isN&&g.phase!=='reveal'){const l=g.lvl[j];rows.push(['あなたの話',l===0?'<span class=win>本当にあった話</span>':`作り話 ${'★'.repeat(l)}${'☆'.repeat(3-l)}`]);if(l>0)rows.push(['入れる言葉',g.words[j].map(esc).join(' / ')])}
  if(isMad&&g.phase!=='reveal')rows.push(['正解',`<span class=win>${g.ansText}</span>`]);
  const voted=g.votes.length+(g.madDone?1:0),hints={role:'役職を確認中。みんなが確認し終わるまで待つ。',talk:isN?'お題の話を語ろう。指定の言葉は自然に混ぜる。':'語り手の話を聞く。矛盾や不自然さを探そう。',interro:isN?'質問には即答。詰まると怪しまれる。':'語り手に1問ずつ質問する。',vote:`投票中 ${voted}/${g.voters.length}。${isN?'みんなが見破れるか見守ろう。':''}`,reveal:''};
  return infoCard('嘘つきグラス',rows,hints[g.phase]||'');
}
const itoInfo=i=>{const g=S.g;if(!g)return '';return infoCard('ならべ酒場',[['テーマ',esc(g.th[0])],['1=',esc(g.th[1])],['100=',esc(g.th[2])],['あなたの数字',`<span class=win>${g.nums[i]}</span>`]],'数字は言わずに、たとえで伝える。')};
const kingInfo=i=>{const g=S.g;if(!g)return '';return infoCard('王様ゲーム',[['あなたの役',g.r[i]?`<span class=lose>${g.r[i]}番</span>`:'<span class=win>王様</span>']],g.r[i]?'王様の命令に従う。番号は命令が終わるまで秘密。':'命令を選んで読み上げる。')};

/* ---- game 1: liar ---- */
const WORDS=['冷蔵庫','社長','終電','コンビニ','犬','雨','パスポート','カラオケ','財布','おばあちゃん','タクシー','カレー','スマホ','海','上司','結婚式','エレベーター','靴','深夜','花火','サウナ','電卓','新幹線','ラーメン','傘','宝くじ','留守電','駐車場','温泉','自販機','ゴミ箱','眼鏡','公園','カメラ','ホテル','朝帰り'];
const QS=['それは何曜日のこと?','その時、隣に誰がいた?','その後どうなった?','一番びっくりした瞬間は?','その場の匂いは?','いくらかかった?','誰に最初に話した?','その時の服装は?','オチをもう一回言って','最初に思ったことは?'];
const CARDS=['指名','免除','身代わり'];
const AB=['A','B'];
/* 嘘のときの難易度(言葉の数)。MAXは約1/10 */
const LVW=[4.5,4.5,1];
const pickLvl=()=>{let r=Math.random()*LVW.reduce((a,b)=>a+b),i=0;while(i<2&&r>=LVW[i]){r-=LVW[i];i++}return i+1};
function liar(){
  const n=N();S.narr=(S.narr+1)%n;
  const dbl=n>=3&&Math.random()<.3,ws=dbl?[S.narr,(S.narr+1)%n]:[S.narr],t=Math.random()<.5;
  const voters=[...Array(n).keys()].filter(i=>!ws.includes(i)),madOn=n>=5||(n===4&&Math.random()<.2);
  const lvl=(dbl?[t,!t]:[t]).map(x=>x?0:pickLvl());
  const g=S.g={ws,dbl,topic:pick(TOPICS),t,votes:[],voters,madOn,mad:madOn?pick(voters):-1,lvl,
    words:lvl.map(l=>[...WORDS].sort(()=>Math.random()-.5).slice(0,l))};
  g.ans=dbl?(t?0:1):(t?1:0);
  g.ansText=dbl?AB[g.ans]+'が本当の話':(g.ans?'本当':'嘘');
  g.liar=dbl?ws[t?1:0]:(t?null:ws[0]);
  g.win=dbl?g.liar:ws[0];
  g.nomN=g.liar!==null?lvl[ws.indexOf(g.liar)]:1;
  S.info=liarInfo;g.phase='intro';
  go(`<p class=k>嘘つきグラス</p><h2>お題: ${esc(g.topic)}</h2>
  <div class=card><p>語り手: <b>${g.ws.map(w=>nm(w)).join(' / ')}</b>${dbl?'(片方だけが本当の話)':''}</p>
  <p class=muted>語り手が話をする。聴き手は質問して、本当の話か作り話かを見抜く。外したらひと口。${madOn?'聴き手の中にペテン師が1人いる(語り手の仲間)。':''}</p><p class=muted>※ ペテン師は5人以上のときに登場(4人のときはたまに)。</p></div>${nextBtn('役を確認する')}`);
  S.cb=()=>{g.phase='role';madOn?roleLoop(0):narrLoop(0)};
}
function cardHtml(j){
  const g=S.g,l=g.lvl[j];
  return `<p class=k>お題</p><h2>${g.topic}</h2>`+(l===0
    ?`<div class=card><p>あなたの役目</p><h3 class=win>本当にあった話をする</h3><p class=muted>言葉の縛りはなし</p></div>${g.dbl?'':`<button class=alt data-act=tolie>話が出ない → 嘘つきモードに切替(難易度は最高★3)</button>`}`
    :`<div class=card><p>あなたの役目</p><h3 class=lose>作り話を本当らしく語る</h3>
      <p>難易度 <b class=win>${'★'.repeat(l)}${'☆'.repeat(3-l)}</b>${l===3?' MAX':''}${g.sw?' 本当の話が出ないので切替。難易度は最高':''}</p><p>次の${l}個を全部話に入れる</p>
      <div class=row>${g.words[j].map(w=>`<h3 class=win>${w}</h3>`).join('')}</div></div>`)
    +`<button data-act=cb>覚えた(画面を伏せる)</button>`;
}
function narrLoop(j){
  const g=S.g;if(j>=g.ws.length)return talk();
  pass(g.ws[j],'嘘つきグラス・語り手'+(g.dbl?AB[j]:''),()=>{S.cb=()=>narrLoop(j+1);go(cardHtml(j))});
}
function roleLoop(p){
  const g=S.g,order=[...g.ws,...[...Array(N()).keys()].filter(x=>!g.ws.includes(x))];
  if(p>=order.length)return talk();
  const i=order[p],j=g.ws.indexOf(i);
  pass(i,'役職確認',()=>{S.cb=()=>roleLoop(p+1);
    go(j>=0?cardHtml(j)
     :i===g.mad?`<h2 class=lose>あなたはペテン師</h2><div class=card><p>語り手の味方。聴き手のふりをして、多数派を外させよう。</p><p>正解は <b class=win>${g.ansText}</b></p><p class=muted>投票はなし。順番が来たらボタンを押すだけ。</p></div><button data-act=cb>覚えた(画面を伏せる)</button>`
     :`<h2>あなたは聴き手</h2><p class=muted>語り手の嘘を見抜こう。この中にペテン師が1人いる。</p><button data-act=cb>覚えた(画面を伏せる)</button>`)});
}
function talk(){
  const g=S.g;g.phase='talk';S.cb=interro;
  go(`<p class=k>語りタイム</p><h2>${g.ws.map((w,j)=>(g.dbl?AB[j]+': ':'')+nm(w)).join(' → ')}</h2>
  <p class=muted>${g.dbl?'AとBが順に1分ずつ語る。片方だけが本当の話。':'1分ほどで語る。'}お題は「${g.topic}」。${g.madOn?'聴き手の中にペテン師が1人いる。':''}</p>${nextBtn('尋問へ')}`);
}
function interro(){
  S.g.phase='interro';S.cb=()=>voteLoop(0);
  go(`<p class=k>尋問タイム</p><h2>聴き手は各1問</h2><p class=muted>語り手は即答。詰まったら怪しい。困ったらこれ。</p>
  <div class=card>${[...QS].sort(()=>Math.random()-.5).slice(0,3).map(q=>`<p>${q}</p>`).join('')}</div>${nextBtn('投票に進む')}`);
}
function voteLoop(k){
  const g=S.g;if(k>=g.voters.length)return liarReveal();
  g.phase='vote';g.k2=k;const me=g.voters[k];
  if(me===g.mad)return pass(me,'投票',()=>go(`<h2>投票</h2><p class=muted>ボタンを押すだけ。</p><button data-act=madok>押した</button>`));
  const row=(lbl,v,cls)=>`<button class=${cls} data-act=vote data-v=${v}>${lbl}</button>`;
  pass(me,'投票',()=>go(`<h2>${g.dbl?'本当の話をしたのは?':nm(g.ws[0])+'の話は?'}</h2>
  <p class=muted>外したらひと口。</p>
  <div class=row>${g.dbl?row('A: '+nm(g.ws[0]),0,'grn')+row('B: '+nm(g.ws[1]),1,'grn'):row('本当',1,'grn')+row('嘘',0,'red')}</div>`));
}
function liarReveal(){
  S.g.phase='reveal';
  const g=S.g,v=g.votes,ok=x=>x[1]===g.ans,right=v.filter(ok),wrong=v.filter(x=>!ok(x));
  wrong.forEach(x=>drink(x[0],1,'嘘つきグラスで外した'));
  const fooled=wrong.length*2>v.length,caught=g.liar!==null&&right.length*2>v.length;
  if(caught)drink(g.liar,1,'見破られた');
  let card='',mad='';
  if(fooled){card=pick(CARDS);S.players[g.win].cards.push(card)}
  if(g.mad>=0){
    if(fooled){const c=pick(CARDS);S.players[g.mad].cards.push(c);mad=`ペテン師は${nm(g.mad)}。語り手が勝ったのでカード「${c}」を獲得`}
    else{drink(g.mad,1,'ペテン師が負けた');mad=`ペテン師は${nm(g.mad)}。負けてひと口`}}
  const said=x=>g.dbl?AB[x[1]]:(x[1]?'本当':'嘘');
  go(`<p class=k>結果</p><h2>${g.dbl?nm(g.liar)+'が作り話でした':(g.t?'本当の話でした':'作り話でした')}</h2>

  <p>${wrong.length?'外した人が飲む: '+wrong.map(x=>nm(x[0])).join('、'):'飲む人なし'}</p>
  ${caught?`<p class=lose>${nm(g.liar)}は見破られた。ひと口</p>`:''}
  ${mad?`<p class=muted>${mad}</p>`:''}
  ${fooled?`<p class=win>${nm(g.win)}の勝ち。カード「${card}」を獲得。さらに誰か1人に×${g.nomN}の指名権${g.liar!==null?'(難易度★'+g.nomN+'の分)':''}</p><div class=row>${S.players.map((_,i)=>i).filter(i=>i!==g.win).map(i=>`<button class=red data-act=nom data-i=${i}>${nm(i)}</button>`).join('')}</div>`:nextBtn()}`);

}

  const g=S.g;g.said=t;

/* おまかせ: light up the tiles like a roulette, then open the one it lands on (same as tapping it) */
let ROUL=0;
function roulette(b){
  const pool=[...document.querySelectorAll('#app .tile')].filter(t=>/^g(1|4|6|7|8|9|10|11|12)$/.test(t.dataset.act));
  const quick=b.classList.contains('quick-play');
  if(ROUL||!pool.length)return;ROUL=1;
  const fin=pool[Math.random()*pool.length|0],reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,steps=reduce?0:14+(Math.random()*4|0);
  const title=quick?b.querySelector('.qp-title'):null,sub=quick?b.querySelector('.qp-sub'):null;
  b.disabled=quick;
  let k=0,cur=null;
  const go1=()=>{
    if(cur&&!quick)cur.classList.remove('hl');
    if(k>=steps){
      if(quick){title.textContent=fin.querySelector('b').textContent;sub.textContent='決定！このゲームで遊ぼう';b.classList.remove('spinning');b.classList.add('picked')}
      else fin.classList.add('hl','win');
      setTimeout(()=>{ROUL=0;if(!document.body.contains(fin))return;if(quick)b.disabled=false;if(NET.on)netClick(fin.dataset.act,{...fin.dataset});else if(A[fin.dataset.act])A[fin.dataset.act](fin)},reduce?0:450);
      return;
    }
    cur=pool[((pool.indexOf(fin)+k+1-steps)%pool.length+pool.length)%pool.length];
    if(quick){title.textContent=cur.querySelector('b').textContent;sub.textContent='ゲームを抽選中…';b.classList.add('spinning')}
    else cur.classList.add('hl');
    k++;setTimeout(go1,50+k*k*1.1);
  };
  go1();
}

function ito(){
  const n=N(),pool=[...Array(100).keys()].map(x=>x+1).sort(()=>Math.random()-.5);
  S.g={th:pick(THEMES),nums:pool.slice(0,n),ord:[]};
  go(`<p class=k>ならべ酒場</p><h2>テーマ: ${S.g.th[0]}</h2><p>全員に1〜100の秘密の数字を配る。数字は言わず、テーマに合う言葉やたとえだけで表現し、相談して小さい順に並べる。</p>
  <p class=muted>順番が間違っていた人がひと口。完璧なら全員セーフでカードが出る。</p>${nextBtn('数字を配る')}`);
  S.info=itoInfo;S.cb=()=>itoLoop(0);
}
function itoLoop(i){
  const g=S.g;if(i>=N()){S.cb=itoOrder;return go(`<p class=k>相談タイム</p><h2>${g.th[0]}</h2><p>1=${g.th[1]} / 100=${g.th[2]}</p><p class=muted>数字は言わない。たとえで表現して、全員で小さい順を決める。</p>${nextBtn('並びが決まった')}`)}
  pass(i,'ならべ酒場',()=>{S.cb=()=>itoLoop(i+1);go(`<p class=k>${g.th[0]}(1=${g.th[1]} / 100=${g.th[2]})</p><h2>あなたの数字</h2><div class=big>${g.nums[i]}</div>${nextBtn('覚えた(伏せる)')}`)});
}
function itoOrder(){
  const g=S.g,left=[...Array(N()).keys()].filter(i=>!g.ord.includes(i));
  if(!left.length)return itoReveal();
  go(`<h2>小さい順にタップ</h2><div class=card><ol>${g.ord.map(i=>`<li>${nm(i)}</li>`).join('')||'<li class=muted>まだなし</li>'}</ol></div>
  <div class=row>${left.map(i=>`<button class=alt data-act=ito data-i=${i}>${nm(i)}</button>`).join('')}</div>${g.ord.length?'<button class=alt data-act=itoundo>1つ戻す</button>':''}`);
}
function itoReveal(){
  const g=S.g,a=g.ord.map(i=>g.nums[i]),L=a.map(()=>1),P=a.map(()=>-1);
  for(let i=0;i<a.length;i++)for(let j=0;j<i;j++)if(a[j]<a[i]&&L[j]+1>L[i]){L[i]=L[j]+1;P[i]=j}
  const keep=new Set();let b=L.indexOf(Math.max(...L));while(b>=0){keep.add(b);b=P[b]}
  const bad=g.ord.filter((_,p)=>!keep.has(p));bad.forEach(i=>drink(i,1,'ならべ酒場で順番が違った'));
  let bonus='';if(!bad.length){const w=Math.random()*N()|0,c=pick(CARDS);S.players[w].cards.push(c);bonus=`<p class=win>完璧! 全員セーフ。ボーナスで${nm(w)}にカード「${c}」</p>`}
  go(`<p class=k>結果</p><h2>${bad.length?'順番ミス':'完璧な並び!'}</h2><div class=card>${g.ord.map((i,p)=>`<div class=pl><span>${nm(i)}</span><b class="${keep.has(p)?'win':'lose'}">${g.nums[i]}</b></div>`).join('')}</div>
  ${bonus||`<p class=lose>ひと口: ${bad.map(nm).join('、')}</p>`}${nextBtn()}`);S.cb=done;
}

/* ---- bomb relay ---- */
const BCAT=['居酒屋のメニュー','ビールの銘柄','都道府県','動物','ラーメンの具','お菓子','野菜','国名','電車の駅名','コンビニの商品','スポーツ','色','乗り物','学校の教科','映画のタイトル','漫画のタイトル','楽器','花の名前','魚の名前','職業','お酒の種類','「あ」から始まる言葉','カタカナの言葉','有名人の名前'];
function beep(f,ms){try{const A_=window.AudioContext||window.webkitAudioContext;S.ac=S.ac||new A_();const o=S.ac.createOscillator(),g=S.ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(S.ac.destination);o.start();o.stop(S.ac.currentTime+ms/1000)}catch(e){}}
function bomb(){
  S.g={cat:pick(BCAT),fuse:(12+Math.random()*25)*1000};
  go(`<p class=k>爆弾リレー</p><h2>お題: ${S.g.cat}</h2><p>点火したら、お題に合う答えを言ってすぐ次の人へスマホを渡す。同じ答えと詰まりはNG。いつ爆発するかは分からない。爆発したとき持っていた人が飲む。</p><button data-act=bstart>導火線に火をつける</button>`);
}
function bombRun(){
  const g=S.g,t0=performance.now();
  go(`<p class=k>お題</p><h2>${g.cat}</h2><div class=big id=bm style="font-size:96px">●</div><p class=muted>答えたら次の人へ!</p>`,()=>{
    const tick=()=>{const el=performance.now()-t0;if(el>=g.fuse)return boom();
      beep(el/g.fuse>.7?1300:880,60);const e=$('#bm');if(e)e.style.opacity=e.style.opacity==='.3'?'1':'.3';
      S.tmr=setTimeout(tick,Math.max(110,700*(1-el/g.fuse)+110))};
    tick();
  });
}
function boom(){
  try{navigator.vibrate&&navigator.vibrate([200,80,300])}catch(e){}beep(120,500);
  go(`<h1 class=lose>ドカン!</h1><p>爆発したとき、スマホを持っていた人は?</p><div class=row>${S.players.map((_,i)=>`<button class=red data-act=bhit data-i=${i}>${nm(i)}</button>`).join('')}</div>`);
}

/* online: the bomb lives on one phone at a time; the holder passes it to someone else, the host keeps the fuse */
function bombNetRun(){
  const g=S.g;g.fuse=(window.__fuse)||g.fuse;g.t0=performance.now();clearTimeout(NET.bt);
  NET.bt=setTimeout(()=>{const h=g.holder;try{navigator.vibrate&&navigator.vibrate([200,80,300])}catch(e){}drink(h,1,'爆弾が爆発');go(`<h1 class=lose>ドカン!</h1><p>${nm(h)}が持っていた。ひと口。</p>${nextBtn()}`);S.cb=done},g.fuse);
  bombHold(Math.random()*N()|0);
}
function bombHold(i){
  const g=S.g;g.holder=i;
  const remain=Math.max(0,g.fuse-(performance.now()-g.t0));
  netShow(i,'',{w:{name:'bombpass',params:{cat:g.cat,remain,total:g.fuse,targets:S.players.map((p,k)=>({k,name:p.name})).filter(x=>x.k!==i)}},cb:res=>bombHold(+res.to),wait:`<p class=k>爆弾リレー</p><h2>爆弾は ${nm(i)} が持っている</h2><p class=muted>お題: ${g.cat}</p>`});
}

/* ---- ボンバー酒場 (online only): the host runs the sim, every phone sends d-pad input and draws the state it receives ---- */
const BTICK=50,BK=2,BCOL=['#f0a63a','#4aa3d8','#5fae7a','#e0553a','#c78bff','#ffd23f','#7bd0c1','#ff8fb8'],BMAX=8,VCOLS=13,VROWS=15;   // phones show at most a 13x15 window and scroll on bigger maps
/* map size: 13x15 is the 4-player standard; k scales the area, and it also grows with the player count (always odd sizes) */
const bmOdd=x=>2*Math.round((x-1)/2)+1;
function bmDims(np,k){const f=Math.max(.7,(k||1)*np/4);return[Math.max(9,bmOdd(13*Math.sqrt(f))),Math.max(11,bmOdd(15*Math.sqrt(f)))]}
function bmSpawns(w,h,np){
  if(np===2)return[[1,1],[w-2,h-2]];
  const mx=(w>>1)|1,my=(h>>1)|1;
  return[[1,1],[w-2,1],[1,h-2],[w-2,h-2],[mx,1],[mx,h-2],[1,my],[w-2,my]].slice(0,np);
}
const ITEMS='fbshkd',IW='fffbbbssshkd';   // 火力 / 爆弾数 / スピード / バリア / キック / 呪い(操作反転)
const BM={seq:{},k:1,sim:null,iv:0,cur:null,seen:null,vis:[],tok:0,pt:[],feed:[],shake:0};
function bmNew(np,k){
  const[w,h]=bmDims(np,k),sp=bmSpawns(w,h,np),g=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const wall=x===0||y===0||x===w-1||y===h-1||(x%2===0&&y%2===0),safe=sp.some(([sx,sy])=>Math.abs(x-sx)+Math.abs(y-sy)<=2);
    g.push(wall?'#':(!safe&&Math.random()<.6?'+':'.'));
  }
  const spi=[];let x0=1,y0=1,x1=w-2,y1=h-2;   // sudden death walks the interior in a spiral
  while(x0<=x1&&y0<=y1){
    for(let x=x0;x<=x1;x++)spi.push([x,y0]);
    for(let y=y0+1;y<=y1;y++)spi.push([x1,y]);
    if(y0<y1)for(let x=x1-1;x>=x0;x--)spi.push([x,y1]);
    if(x0<x1)for(let y=y1-1;y>y0;y--)spi.push([x0,y]);
    x0++;y0++;x1--;y1--;
  }
  return{g,w,h,np,sdn:Math.round(900*BK*Math.sqrt(w*h/195)),sds:(w*h>260?2:3)*BK,tick:0,t0:30*BK,rc:30*BK,ph:'ready',b:[],f:[],spi,sdi:0,rank:null,
    p:Array.from({length:np},(_,i)=>({i,x:sp[i][0],y:sp[i][1],a:1,mb:1,pw:2,sp:4,cd:0,dx:0,dy:0,nb:0,d:0,sh:0,inv:0,kick:0,rv:0,sx:0,sy:0,inT:0}))};
}
const bmAt=(s,x,y)=>s.g[y*s.w+x];
function bmFree(s,x,y,p){const c=bmAt(s,x,y);if(c==='#'||c==='+')return false;return !s.b.some(b=>b.x===x&&b.y===y&&!b.walk.includes(p.i))}
function bmKill(s,p,force){
  if(!p.a||p.inv>0&&!force)return;
  if(p.sh&&!force){p.sh=0;p.inv=8*BK;return}   // barrier soaks one hit
  p.a=0;p.d=s.tick;
}
function bmInput(s,i,m){
  const p=s&&s.p[i];if(!p||!p.a||s.ph==='over')return;
  p.dx=Math.sign(+m.dx||0);p.dy=p.dx?0:Math.sign(+m.dy||0);p.inT=s.tick;
  p.sx=p.dy?Math.sign(+m.ax||0):0;p.sy=p.dx?Math.sign(+m.ay||0):0;   // diagonal stick: the other axis is the fallback when the main one is blocked
  if(m.bomb&&s.ph==='play'&&p.nb<p.mb&&!s.b.some(b=>b.x===p.x&&b.y===p.y)){
    s.b.push({x:p.x,y:p.y,t:24*BK,pw:p.pw,o:i,walk:s.p.filter(q=>q.a&&q.x===p.x&&q.y===p.y).map(q=>q.i)});p.nb++;
  }
}
function bmTick(s){
  s.tick++;
  if(s.ph==='ready'){if(--s.rc<=0){s.ph='play';s.t0=s.tick}return}
  if(s.ph!=='play')return;
  if(s.tick-s.t0>=s.sdn&&s.tick%s.sds===0&&s.sdi<s.spi.length){   // sudden death after ~90s (longer on bigger maps)
    const[x,y]=s.spi[s.sdi++];s.g[y*s.w+x]='#';
    s.b=s.b.filter(b=>{if(b.x===x&&b.y===y){s.p[b.o].nb--;return false}return true});
    s.p.forEach(p=>{if(p.x===x&&p.y===y)bmKill(s,p,1)});
  }
  s.p.forEach(p=>{
    if(!p.a)return;if(p.cd>0)p.cd--;if(p.inv>0)p.inv--;if(p.rv>0)p.rv--;
    if(s.exp&&(p.dx||p.dy)&&s.tick-p.inT>8*BK)p.dx=p.dy=0;   // phones re-send a held direction every 250ms; silence means the release got lost
    if(p.cd<=0&&(p.dx||p.dy)){
      const ord=[[p.dx,p.dy]];if(p.sx||p.sy)ord.push([p.sx,p.sy]);
      for(const[ux,uy]of ord){
        const mx=p.rv>0?-ux:ux,my=p.rv>0?-uy:uy,nx=p.x+mx,ny=p.y+my,kb=p.kick&&s.b.find(b=>b.x===nx&&b.y===ny&&!b.walk.includes(p.i));
        if(kb){kb.vx=mx;kb.vy=my;p.cd=p.sp;break}
        if(bmFree(s,nx,ny,p)){
          p.x=nx;p.y=ny;p.cd=p.sp;
          s.b.forEach(b=>{if(b.walk.includes(p.i)&&!(b.x===p.x&&b.y===p.y))b.walk=b.walk.filter(k=>k!==p.i)});
          const c=bmAt(s,nx,ny);
          if(c==='f')p.pw++;else if(c==='b')p.mb++;else if(c==='s')p.sp=Math.max(2,p.sp-1);else if(c==='h')p.sh=1;else if(c==='k')p.kick=1;else if(c==='d')p.rv=50*BK;
          if(ITEMS.includes(c))s.g[ny*s.w+nx]='.';
          break;
        }
      }
    }
  });
  s.b.forEach(b=>{
    b.t--;
    if((b.vx||b.vy)&&s.tick%(2*BK)===0){const nx=b.x+b.vx,ny=b.y+b.vy,c=bmAt(s,nx,ny);
      if(c==='#'||c==='+'||s.b.some(o=>o!==b&&o.x===nx&&o.y===ny)||s.p.some(q=>q.a&&q.x===nx&&q.y===ny))b.vx=b.vy=0;else{b.x=nx;b.y=ny}}
  });
  const q=s.b.filter(b=>b.t<=0);
  while(q.length){
    const b=q.pop();if(b.done)continue;b.done=1;s.p[b.o].nb--;
    const cells=[[b.x,b.y]];
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])for(let k=1;k<=b.pw;k++){
      const x=b.x+dx*k,y=b.y+dy*k,c=bmAt(s,x,y);if(c==='#')break;
      cells.push([x,y]);
      if(c==='+'){s.g[y*s.w+x]=Math.random()<.4?IW[Math.random()*IW.length|0]:'.';break}
      if(ITEMS.includes(c)){s.g[y*s.w+x]='.';break}
    }
    cells.forEach(([x,y])=>{s.f.push({x,y,t:4*BK});s.b.forEach(o=>{if(!o.done&&o.x===x&&o.y===y)q.push(o)})});
  }
  s.b=s.b.filter(b=>!b.done);
  s.f.forEach(f=>f.t--);
  s.p.forEach(p=>{if(p.a&&s.f.some(f=>f.x===p.x&&f.y===p.y))bmKill(s,p)});
  s.f=s.f.filter(f=>f.t>0);
  if(s.p.filter(p=>p.a).length<=1){
    s.ph='over';
    const key=p=>p.a?1e9:p.d;
    s.rank=s.p.map(p=>1+s.p.filter(o=>key(o)>key(p)).length);
  }
}
const bmMsg=s=>({k:'bm',t:s.tick,ph:s.ph,rc:s.rc,w:s.w,h:s.h,sd:s.tick-s.t0,sdn:s.sdn,g:s.g.join(''),p:s.p.map(p=>[p.x,p.y,p.a,p.sh,p.rv>0?1:0,p.pw,p.mb,p.sp,p.kick]),b:s.b.map(b=>[b.x,b.y,b.t]),f:s.f.map(f=>[f.x,f.y]),rk:s.rank});
BM.recv=m=>{if(m&&m.k==='bm'&&(!BM.cur||m.t>=BM.cur.t))BM.cur=m};
BM.stop=()=>{clearInterval(BM.iv);BM.iv=0;if(BM.sim)clearTimeout(BM.sim.endT);BM.sim=null;BM.cur=null;BM.seen=null;BM.tok=0};
function bmPub(){const s=BM.sim;if(!s)return;const m=bmMsg(s);BM.recv(m);try{NET.room.pub('bm/st',m)}catch(e){}}
function bmStep(){
  const s=BM.sim;if(!s)return;bmTick(s);if(s.tick%2===0||s.ph==='over')bmPub();
  if(s.ph==='over'&&!s.endT)s.endT=setTimeout(bomberResult,3200);
}
function bomberIntro(){
  go(`<p class=k>ボンバー酒場</p><h2>爆弾で最後の1人になれ</h2>
  <div class=card><p>十字キーで移動、爆弾ボタンで設置。ブロックを壊すとアイテムが出る。爆風に当たったら脱落。</p>
  <div class=bmleg><span><i style="background:#e0553a">火</i>火力</span><span><i style="background:#c9c2b8">弾</i>爆弾数</span><span><i style="background:#5fae7a">速</i>スピード</span><span><i style="background:#4aa3d8">盾</i>バリア</span><span><i style="background:#e8c33a">蹴</i>キック</span><span><i style="background:#b58ae0">呪</i>操作が逆</span></div>
  <p class=muted>順位が低いほど罰ポイント(2位=1pt、3位=2pt、4位以下=3pt)。勝者はカードを獲得。時間がたつと外側から壁がせり出す。最大8人で、${N()>BMAX?'9人目以降は観戦。':'人数が多いほどマップが広がる(画面は自分を追って動く)。'}</p></div>
  <p class=k>マップの広さ</p><div class=row>${[.7,1,1.5,2,3].map(k=>`<button class="alt sm ${BM.k===k?'sel':''}" data-act=bmk data-k=${k}>×${k}</button>`).join('')}</div>
  <p class=muted>${(()=>{const[w,h]=bmDims(Math.min(N(),BMAX),BM.k);return `この人数で ${w}×${h}マス`})()}</p>${nextBtn('スタート')}`);
  S.cb=bomberStart;
}
function bomberStart(){
  BM.stop();
  const n=N(),np=Math.min(n,BMAX);BM.sim=bmNew(np,BM.k);BM.sim.exp=1;BM.seq={};BM.np=np;
  if(BM.hroom!==NET.room){BM.hroom=NET.room;NET.room.sub('bm/in',m=>{
    const i=NET.roster.indexOf(m.from),s=BM.sim;if(i<0||!s||!s.p[i])return;
    if(m.n===undefined||m.n>(BM.seq[i]||0)){BM.seq[i]=m.n;bmInput(s,i,m)}   // the 3 brokers can deliver out of order: only a newer message may change the direction
    else if(m.bomb)bmInput(s,i,{dx:s.p[i].dx,dy:s.p[i].dy,bomb:1});
    if(m.bomb)bmPub();
  })}
  const each={};for(let i=0;i<n;i++)each[i]={html:'',w:{name:'bomber',params:{i,np,names:S.players.map(p=>p.name),w:BM.sim.w,h:BM.sim.h}}};
  netShow('each','',{each,expect:[],wait:'<p class=k>ボンバー酒場</p><h2>対戦中</h2>'});
  BM.iv=setInterval(bmStep,BTICK);
}
function bomberResult(){
  const s=BM.sim;if(!s||!s.rank)return;const rk=s.rank,np=BM.np;BM.stop();
  const order=[...Array(np).keys()].sort((a,b)=>rk[a]-rk[b]),pt=i=>Math.min(3,rk[i]-1);
  order.forEach(i=>{if(rk[i]>1)drink(i,pt(i),'ボンバー酒場で'+rk[i]+'位')});
  const w=order.filter(i=>rk[i]===1);let card='';
  if(w.length===1){const c=pick(CARDS);S.players[w[0]].cards.push(c);card=`${nm(w[0])}はカード「${c}」を獲得。`}
  go(`<p class=k>ボンバー酒場</p><h2>${w.length===1?nm(w[0])+'の勝ち!':'引き分け'}</h2><div class=card>${order.map(i=>`<div class=pl><span>${rk[i]}位 ${nm(i)}</span><b class="${rk[i]>1?'lose':'win'}">${rk[i]>1?'罰 '+pt(i)+'pt':'0pt'}</b></div>`).join('')}</div><p>${card}</p>
  <button data-act=bagain>もう一回</button>${nextBtn('ゲーム選択へ')}`);
  S.cb=done;
}
/* tiny synth, only used after the player has touched the screen */
function bmSnd(kind){
  try{
    if(localStorage.getItem('dk_mute')==='1')return;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=BM.ac||(BM.ac=new AC());if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,tone=(f1,f2,d,type,v)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)};
    ({place:()=>tone(320,200,.08,'square',.04),boom:()=>{tone(150,40,.35,'sawtooth',.1);tone(520,60,.18,'square',.04)},pick:()=>tone(600,980,.09,'triangle',.07),die:()=>tone(420,60,.5,'sawtooth',.08),count:()=>tone(660,660,.09,'square',.05),go:()=>tone(880,1400,.25,'square',.07),win:()=>tone(520,1050,.55,'triangle',.09)})[kind]();
  }catch(e){}
}

/* the screen every phone runs: canvas + d-pad + bomb */

/* ---- who is it ---- */
const WHO=['一番モテそうなのは?','一番お金持ちになりそうなのは?','酔うと一番面倒なのは?','浮気しそうなのは?','一番寝坊しそうなのは?','怒ると一番怖いのは?','無人島で最初に脱落しそうなのは?','一番隠し事が多そうなのは?','芸能人になれそうなのは?','一番方向音痴なのは?','結婚が早そうなのは?','一番お酒に強そうなのは?','変な趣味がありそうなのは?','宝くじが当たったら黙って消えそうなのは?','一番嘘が上手そうなのは?','最後まで飲んでいそうなのは?','一番泣き上戸なのは?','独り言が多そうなのは?','一番忘れ物が多そうなのは?','二日酔いで会社を休みそうなのは?'];
function who(){
  S.g={q:pick(WHO),votes:[]};
  go(`<p class=k>犯人は誰だ</p><h2>${S.g.q}</h2><p>1人ずつ秘密で指名する。いちばん指名された人がひと口。全員一致に近いと倍。誰が誰に入れたかは最後に公開。</p>${nextBtn('投票へ')}`);
  S.cb=()=>whoLoop(0);

function savePosterImage(share){
  /* online: a non-host phone has no game state, so reuse the poster already shown on screen (built by the host) */
  const prev=document.querySelector('.poster-preview'),uri=prev&&prev.src.indexOf('data:image/svg+xml')===0?prev.src:posterDataUri(),svg=decodeURIComponent(uri.slice(uri.indexOf(',')+1)),img=new Image();

    const canvas=document.createElement('canvas');canvas.width=960;canvas.height=1280;

    canvas.toBlob(async blob=>{
      if(!blob){const a=document.createElement('a');a.href=posterDataUri();a.download='dokuro-saloon-poster.svg';a.click();return}
      if(share&&navigator.share){
        try{
          const file=new File([blob],'dokuro-saloon-poster.png',{type:'image/png'});
          if(!navigator.canShare||navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'今夜の戦績 | ドクロ酒場'});return}

  img.src=uri;
}

/* ================= online mode: each person plays on their own phone =================
   Host-authoritative: the host phone runs the game exactly as offline. Screens go out over a public MQTT relay:
   public ones to everybody, secret ones only to the one player's phone (everyone else sees "◯◯が操作中").
   Taps come back to the host, which checks who may press what. */
const NET={on:false,host:false,room:null,code:'',phase:'',ep:0,seq:0,roster:[],me:-1,cur:null,proxy:new Set(),last:{all:null,priv:null},shownKey:'',err:''};
function mqttRoom(){
  const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
  return{join:name=>new Promise((resolve,reject)=>{
    const id=Math.random().toString(36).slice(2,10),base='dokuro-saloon-bar/'+name+'/',state=new Map(),hs=new Set(),cs=[],subs=new Map(),seen=new Set();
    let done=false,cur={},tp=0,failed=0,lastErr='',to=0,hb=0;
    const fire=()=>hs.forEach(h=>{try{h({})}catch(e){}});
    const push=()=>{const pl=JSON.stringify({p:cur,t:Date.now()});cs.forEach(o=>{if(o.up)try{o.m.publish(base+'p/'+id,pl,{retain:true,qos:0})}catch(e){}})};
    const bad=e=>{lastErr=(e&&e.message)||String(e);if(!done&&++failed>=BROKERS.length){done=true;clearTimeout(to);reject(new Error(lastErr))}};

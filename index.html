<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ドクロ酒場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* layout: 1 column game table, one screen at a time, pass-the-phone flow */
:root{--ink:#17120f;--panel:#231b16;--line:#3a2d24;--fg:#f3e9dc;--mute:#a89886;--amber:#f0a63a;--red:#e0553a;--green:#5fae7a;--blue:#4aa3d8;
--display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;--body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:500 16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;-webkit-user-select:none;user-select:none}
#app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:34px;color:var(--amber)} h2{font-size:24px} h3{font-size:18px}
p{margin:0} .muted{color:var(--mute);font-size:14px} .k{color:var(--amber);font-size:13px;letter-spacing:.12em}
button,input{font:inherit;color:inherit}
button{background:var(--amber);color:#1c1308;border:0;border-radius:10px;min-height:54px;padding:10px 16px;font-weight:700;font-size:17px;cursor:pointer}
button.alt{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
button.red{background:var(--red);color:#fff} button.grn{background:var(--green);color:#10200f}
button.sel{outline:3px solid var(--fg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px} .row>*{flex:1 1 120px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
input{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)} .pl:last-child{border:0}
.dots{display:inline-flex;gap:5px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--amber)}.dots i.on{background:var(--amber)}
.tag{background:var(--red);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-left:6px}
.big{font:400 64px/1.1 var(--display);text-align:center;font-variant-numeric:tabular-nums;padding:18px 0}
.pad{display:grid;place-items:center;height:260px;border-radius:14px;background:var(--red);font:400 34px var(--display);touch-action:manipulation}
.pad.go{background:var(--green);color:#10200f}
canvas{width:100%;max-width:360px;height:auto;align-self:center;border-radius:14px;border:1px solid var(--line);touch-action:none}
.ev{border:2px dashed var(--amber);border-radius:12px;padding:12px;color:var(--amber)}
.win{color:var(--green)} .lose{color:var(--red)} b{font-weight:700}
button.sm{min-height:36px;font-size:14px;padding:4px 10px;flex:0 0 auto}
.bet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad.fake{background:var(--blue);color:#07202e}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{font:400 26px var(--display);min-height:56px;padding:0;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.grid button.x{background:var(--red)} .grid button.off{visibility:hidden}
.mis{display:flex;flex-direction:column;gap:8px}
.sub{display:block;font-weight:500;font-size:12px;opacity:.8}
button[disabled]{opacity:.4;cursor:not-allowed}
ol{margin:0;padding-left:1.4em}
#gbar{max-width:440px;margin:0 auto 8px;display:flex}#gbar[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(10,8,6,.8);display:grid;place-items:center;padding:24px;z-index:20}#modal[hidden]{display:none}#modal .card{max-width:360px;width:100%}
@media (prefers-reduced-motion:no-preference){#app>*{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.4/mqtt.min.js"></script>
<div id="gbar" hidden><button class="alt sm" id="gback">← ゲーム選択に戻る</button></div>
<div id="app"></div>
<div id="modal" hidden><div class="card"><h3>ゲームを中断する?</h3><p class=muted id="mtxt"></p><div class=row><button class=red id="mok2">中断して選択に戻る</button><button class=alt id="mno">続ける</button></div></div></div>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0],clamp=(v,m=1)=>Math.max(-m,Math.min(m,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOPICS=['最近いちばん恥ずかしかったこと','人生で一番高い買い物の話','初めて一人で行った旅行','学生時代の黒歴史','拾った/落とした物の話','有名人に会った話','死にかけた体験','バイトでやらかした話','変な夢の話','一番怖かった体験'];
const EVENTS=['全員、利き手と反対の手でスマホを持つこと','最年少が1人指名して、ひと口飲ませる','全員で乾杯してから次へ','次の1ラウンド、語尾に「ござる」をつける','スマホを持つ人は立って操作する','いま一番酔ってそうな人が1人を指名して乾杯'];
const S={players:[],names:['','','',''],n:4,level:1,round:0,log:[],g:null,cb:null,raf:0,evShown:-1,ev:'',narr:-1};
const N=()=>S.players.length,nm=i=>esc(S.players[i].name);
function render(html,after){cancelAnimationFrame(S.raf);clearTimeout(S.tmr);clearInterval(S.tmr);$('#app').innerHTML=html;const gb=$('#gbar');if(gb)gb.hidden=!(S.inGame&&(!NET.on||NET.host));scrollTo(0,0);after&&after()}
/* go = a screen for everyone, gop = a screen only player i may see/act on. Offline both just render; online the host sends them to the right phones. */
function go(html,after){if(!NET.on)return render(html,after);netShow(S.pi!=null?S.pi:'all',html)}
function gop(i,html,after){if(!NET.on)return render(html,after);netShow(i,html)}
function drink(i,k,why){const p=S.players[i];p.lives=Math.max(0,p.lives-k);p.drinks+=k;S.log.push(`R${S.round+1} ${p.name}: ${why}`);try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
const dots=p=>'<span class=dots>'+[0,1,2].map(k=>`<i class="${k<p.lives?'on':''}"></i>`).join('')+'</span>';
const nextBtn=(t='次へ')=>`<button data-act=cb>${t}</button>`;
function pass(i,label,next){S.cb=next;if(NET.on){S.pi=i;try{next()}finally{S.pi=null}return}go(`<p class=k>${label}</p><h2>${nm(i)}にスマホを渡して</h2><p class=muted>他の人は画面を見ない</p><button data-act=cb>私が${nm(i)}です</button>`)}

/* ---- setup ---- */
function setup(){
  S.inGame=false;
  const sv=savedInfo();
  const inputs=Array.from({length:S.n},(_,i)=>`<input id="n${i}" maxlength=8 placeholder="プレイヤー${i+1}" value="${esc(S.names[i]||'')}">`).join('');
  go(`<h1>ドクロ酒場</h1>${sv?`<button data-act=resume>前回の夜を続ける(${sv.players.length}人 / ラウンド${sv.round+1})</button>`:''}<p class=muted>1台のスマホを回して遊ぶ試作版。飲めない人は水でOK。ライフが減る=ひと口。</p>
  <div class=card><h3>人数</h3><div class=row>${[2,3,4,5,6,7,8].map(n=>`<button class="alt ${n===S.n?'sel':''}" data-act=setn data-i=${n}>${n}</button>`).join('')}</div>${inputs}</div>
  <p class=muted>嘘つきグラス: 5人以上は毎回、狂人が1人。4人は5回に1回ほど狂人あり。</p><button data-act=start>乾杯!(1台を回す)</button>${window.mqtt&&window.top===window?'<button class=alt data-act=netmenu>オンライン(各自のスマホで遊ぶ)</button><p class=muted>オンライン: 幹事のスマホがゲームを進行する。全員が自分のスマホで操作。</p>':''}`);
}
/* ---- save / resume + link to the invaders page (same origin, so localStorage is shared) ---- */
const SAVE_KEYS=['players','names','n','round','log','evShown','ev','narr','dans'];
function save(){try{const o={};SAVE_KEYS.forEach(k=>o[k]=S[k]);o.t=Date.now();localStorage.setItem('dk_state',JSON.stringify(o))}catch(e){}}
function savedInfo(){try{const o=JSON.parse(localStorage.getItem('dk_state')||'null');return o&&o.players&&o.players.length&&Date.now()-o.t<12*3600e3?o:null}catch(e){return null}}
function load(){const o=savedInfo();if(!o)return false;SAVE_KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k]});return true}
function importInv(){
  try{
    const r=JSON.parse(localStorage.getItem('dk_result')||'null');localStorage.removeItem('dk_result');
    if(!r||!Array.isArray(r.drinks)||r.drinks.length!==N())return;
    r.drinks.forEach((k,i)=>{if(k>0)drink(i,k,'インベーダーで'+(r.hits&&r.hits[i]?`被弾${r.hits[i]}回`:'')+(r.last===i?'(最下位)':''))});
    S.log.push(`インベーダー: WAVE ${r.wave} / ${r.score}点`);
    S.note=`WAVE ${r.wave} / ${r.score}点。`+S.players.map((p,i)=>r.drinks[i]>0?`${p.name} ×${r.drinks[i]}`:'').filter(Boolean).join('、')+' がひと口';
    save();
  }catch(e){}
}
function openInv(){
  save();
  if(window.top!==window||location.protocol==='file:'){window.open('https://warabinbin.github.io/dokuro-saloon/invaders/','_blank');return}
  location.href='invaders/?from=bar';
}
function readNames(){for(let i=0;i<S.n;i++){const e=$('#n'+i);if(e)S.names[i]=e.value}}

/* ---- hub ---- */
function hub(){
  S.inGame=false;save();
  if(S.round>0&&S.round%5===0&&S.evShown!==S.round){S.evShown=S.round;S.ev=pick(EVENTS)}
  const ev=S.evShown===S.round&&S.round>0?`<div class=ev><b>ランダムイベント</b><br>${S.ev}</div>`:'';
  const note=S.note?`<div class=ev><b>インベーダーの結果</b><br>${esc(S.note)}</div>`:'';S.note='';
  go(`<p class=k>ラウンド ${S.round+1}</p>${ev}${note}
  <div class=card>${S.players.map((p,i)=>`<div class=pl><span>${esc(p.name)}${p.lives?'':'<span class=tag>罰ゲーム役</span>'}</span>${dots(p)}</div>${p.cards.length?`<div class=row>${p.cards.map((c,k)=>`<button class="sm grn" data-act=card data-i=${i} data-k=${k}>${c}</button>`).join('')}</div>`:''}`).join('')}</div>
  ${menu()}
  <button class="alt" data-act=end>今夜はここまで(結果)</button>`);
}
const done=()=>{S.round++;hub()};

/* ---- game 1: liar ---- */
const WORDS=['冷蔵庫','社長','終電','コンビニ','犬','雨','パスポート','カラオケ','財布','おばあちゃん','タクシー','カレー','スマホ','海','上司','結婚式','エレベーター','靴','深夜','花火','サウナ','電卓','新幹線','ラーメン','傘','宝くじ','留守電','駐車場','温泉','自販機','ゴミ箱','眼鏡','公園','カメラ','ホテル','朝帰り'];
const QS=['それは何曜日のこと?','その時、隣に誰がいた?','その後どうなった?','一番びっくりした瞬間は?','その場の匂いは?','いくらかかった?','誰に最初に話した?','その時の服装は?','オチをもう一回言って','最初に思ったことは?'];
const CARDS=['指名','免除','身代わり'];
const AB=['A','B'];
/* 嘘のときの難易度(言葉の数)。MAXは約1/10 */
const LVW=[4.5,4.5,1];
const pickLvl=()=>{let r=Math.random()*LVW.reduce((a,b)=>a+b),i=0;while(i<2&&r>=LVW[i]){r-=LVW[i];i++}return i+1};
function liar(){
  const n=N();S.narr=(S.narr+1)%n;
  const dbl=n>=3&&Math.random()<.3,ws=dbl?[S.narr,(S.narr+1)%n]:[S.narr],t=Math.random()<.5;
  const voters=[...Array(n).keys()].filter(i=>!ws.includes(i)),madOn=n>=5||(n===4&&Math.random()<.2);
  const lvl=(dbl?[t,!t]:[t]).map(x=>x?0:pickLvl());
  const g=S.g={ws,dbl,topic:pick(TOPICS),t,votes:[],voters,madOn,mad:madOn?pick(voters):-1,lvl,
    words:lvl.map(l=>[...WORDS].sort(()=>Math.random()-.5).slice(0,l))};
  g.ans=dbl?(t?0:1):(t?1:0);
  g.ansText=dbl?AB[g.ans]+'が本当の話':(g.ans?'本当':'嘘');
  g.liar=dbl?ws[t?1:0]:(t?null:ws[0]);
  g.win=dbl?g.liar:ws[0];
  g.nomN=g.liar!==null?lvl[ws.indexOf(g.liar)]:1;
  madOn?roleLoop(0):narrLoop(0);
}
function cardHtml(j){
  const g=S.g,l=g.lvl[j];
  return `<p class=k>お題</p><h2>${g.topic}</h2>`+(l===0
    ?`<div class=card><p>あなたの役目</p><h3 class=win>本当にあった話をする</h3><p class=muted>言葉の縛りはなし</p></div>${g.dbl?'':`<button class=alt data-act=tolie>話が出ない → 嘘つきモードに切替(難易度は最高★3)</button>`}`
    :`<div class=card><p>あなたの役目</p><h3 class=lose>作り話を本当らしく語る</h3>
      <p>難易度 <b class=win>${'★'.repeat(l)}${'☆'.repeat(3-l)}</b>${l===3?' MAX':''}${g.sw?' 本当の話が出ないので切替。難易度は最高':''}</p><p>次の${l}個を全部話に入れる</p>
      <div class=row>${g.words[j].map(w=>`<h3 class=win>${w}</h3>`).join('')}</div></div>`)
    +`<button data-act=cb>覚えた(画面を伏せる)</button>`;
}
function narrLoop(j){
  const g=S.g;if(j>=g.ws.length)return talk();
  pass(g.ws[j],'嘘つきグラス・語り手'+(g.dbl?AB[j]:''),()=>{S.cb=()=>narrLoop(j+1);go(cardHtml(j))});
}
function roleLoop(p){
  const g=S.g,order=[...g.ws,...[...Array(N()).keys()].filter(x=>!g.ws.includes(x))];
  if(p>=order.length)return talk();
  const i=order[p],j=g.ws.indexOf(i);
  pass(i,'役職確認',()=>{S.cb=()=>roleLoop(p+1);
    go(j>=0?cardHtml(j)
     :i===g.mad?`<h2 class=lose>あなたは狂人</h2><div class=card><p>語り手の味方。聴き手のふりをして、多数派を外させよう。</p><p>正解は <b class=win>${g.ansText}</b></p><p class=muted>投票はなし。順番が来たらボタンを押すだけ。</p></div><button data-act=cb>覚えた(画面を伏せる)</button>`
     :`<h2>あなたは聴き手</h2><p class=muted>語り手の嘘を見抜こう。この中に狂人が1人いる。</p><button data-act=cb>覚えた(画面を伏せる)</button>`)});
}
function talk(){
  const g=S.g;S.cb=interro;
  go(`<p class=k>語りタイム</p><h2>${g.ws.map((w,j)=>(g.dbl?AB[j]+': ':'')+nm(w)).join(' → ')}</h2>
  <p class=muted>${g.dbl?'AとBが順に1分ずつ語る。片方だけが本当の話。':'1分ほどで語る。'}お題は「${g.topic}」。${g.madOn?'聴き手の中に狂人が1人いる。':''}</p>${nextBtn('尋問へ')}`);
}
function interro(){
  S.cb=()=>voteLoop(0);
  go(`<p class=k>尋問タイム</p><h2>聴き手は各1問</h2><p class=muted>語り手は即答。詰まったら怪しい。困ったらこれ。</p>
  <div class=card>${[...QS].sort(()=>Math.random()-.5).slice(0,3).map(q=>`<p>${q}</p>`).join('')}</div>${nextBtn('投票に進む')}`);
}
function voteLoop(k){
  const g=S.g;if(k>=g.voters.length)return liarReveal();
  g.k2=k;const me=g.voters[k];
  if(me===g.mad)return pass(me,'投票',()=>go(`<h2>投票</h2><p class=muted>ボタンを押すだけ。</p><button data-act=madok>押した</button>`));
  const row=(lbl,v,cls)=>`<button class=${cls} data-act=vote data-v=${v}>${lbl}</button>`;
  pass(me,'投票',()=>go(`<h2>${g.dbl?'本当の話をしたのは?':nm(g.ws[0])+'の話は?'}</h2>
  <p class=muted>外したらひと口。</p>
  <div class=row>${g.dbl?row('A: '+nm(g.ws[0]),0,'grn')+row('B: '+nm(g.ws[1]),1,'grn'):row('本当',1,'grn')+row('嘘',0,'red')}</div>`));
}
function liarReveal(){
  const g=S.g,v=g.votes,ok=x=>x[1]===g.ans,right=v.filter(ok),wrong=v.filter(x=>!ok(x));
  wrong.forEach(x=>drink(x[0],1,'嘘つきグラスで外した'));
  const fooled=wrong.length*2>v.length,caught=g.liar!==null&&right.length*2>v.length;
  if(caught)drink(g.liar,1,'見破られた');
  let card='',mad='';
  if(fooled){card=pick(CARDS);S.players[g.win].cards.push(card)}
  if(g.mad>=0){
    if(fooled){const c=pick(CARDS);S.players[g.mad].cards.push(c);mad=`狂人は${nm(g.mad)}。語り手が勝ったのでカード「${c}」を獲得`}
    else{drink(g.mad,1,'狂人が負けた');mad=`狂人は${nm(g.mad)}。負けてひと口`}}
  const said=x=>g.dbl?AB[x[1]]:(x[1]?'本当':'嘘');
  go(`<p class=k>結果</p><h2>${g.dbl?nm(g.liar)+'が作り話でした':(g.t?'本当の話でした':'作り話でした')}</h2>
  <div class=card>${v.map(x=>`<div class=pl><span>${nm(x[0])}</span><b class="${ok(x)?'win':'lose'}">${said(x)}</b></div>`).join('')}</div>
  <p>${wrong.length?'外した人が飲む: '+wrong.map(x=>nm(x[0])).join('、'):'飲む人なし'}</p>
  ${caught?`<p class=lose>${nm(g.liar)}は見破られた。ひと口</p>`:''}
  ${mad?`<p class=muted>${mad}</p>`:''}
  ${fooled?`<p class=win>${nm(g.win)}の勝ち。カード「${card}」を獲得。さらに誰か1人に×${g.nomN}の指名権${g.liar!==null?'(難易度★'+g.nomN+'の分)':''}</p><div class=row>${S.players.map((_,i)=>i).filter(i=>i!==g.win).map(i=>`<button class=red data-act=nom data-i=${i}>${nm(i)}</button>`).join('')}</div>`:nextBtn()}`);
  S.cb=done;
}

/* ---- game 4: draw relay ---- */
const DRAW=['猫','犬','富士山','寿司','ラーメン','自転車','飛行機','ゾウ','ギター','傘','時計','カレー','ロボット','雪だるま','カメラ','ペンギン',
'リンゴ','バナナ','スイカ','ピザ','ハンバーガー','おにぎり','たこ焼き','ケーキ','アイスクリーム',
'テレビ','冷蔵庫','電話','ベッド','椅子','机','ドア','窓','鍵','眼鏡','帽子','靴','Tシャツ',
'太陽','月','星','雲','虹','雷','雪','花火','海','山','木','花','ひまわり',
'キリン','ライオン','うさぎ','パンダ','カメ','魚','カエル','ヘビ','クジラ','イルカ','タコ','カニ','ハチ','チョウチョ','ニワトリ',
'電車','バス','船','ロケット','パトカー','救急車','トラクター','ヘリコプター',
'サッカーボール','野球バット','テニスラケット','バスケットゴール','ドラム','ピアノ','マイク',
'ドラゴン','幽霊','宇宙人','サンタクロース','忍者','侍','海賊','魔女','ドクロ',
'城','橋','東京タワー','ピラミッド','灯台','観覧車','信号機',
'カラオケ','乾杯','ビール','ワイングラス','枝豆'];
const COL=['#f0a63a','#4aa3d8','#5fae7a','#e0553a','#c78bff','#f3e9dc','#ffd23f'];

const THEMES=[['怖いもの','怖くない','超怖い'],['重いもの','軽い','重い'],['高そうな買い物','安い','高い'],['寒い場所','暑い','寒い'],['すごい人','普通','すごい'],['モテる職業','モテない','モテる'],['辛い食べ物','辛くない','激辛'],['恥ずかしい出来事','平気','死にたい'],['大きい生き物','小さい','巨大'],['速い乗り物','遅い','速い'],['お酒の強さ','下戸','ザル'],['うるさい音','静か','爆音'],['眠くなるもの','眠れない','即寝'],['面倒な家事','楽','最悪'],['有名な人','無名','超有名'],['痛いこと','痛くない','激痛'],['楽しい遊び','退屈','最高'],['長生きな生き物','短命','長寿'],['臭いもの','無臭','悪臭'],['危険なスポーツ','安全','命がけ']];
function ito(){
  const n=N(),pool=[...Array(100).keys()].map(x=>x+1).sort(()=>Math.random()-.5);
  S.g={th:pick(THEMES),nums:pool.slice(0,n),ord:[]};
  go(`<p class=k>ならべ酒場</p><h2>テーマ: ${S.g.th[0]}</h2><p>全員に1〜100の秘密の数字を配る。数字は言わず、テーマに合う言葉やたとえだけで表現し、相談して小さい順に並べる。</p>
  <p class=muted>順番が間違っていた人がひと口。完璧なら全員セーフでカードが出る。</p>${nextBtn('数字を配る')}`);
  S.cb=()=>itoLoop(0);
}
function itoLoop(i){
  const g=S.g;if(i>=N()){S.cb=itoOrder;return go(`<p class=k>相談タイム</p><h2>${g.th[0]}</h2><p>1=${g.th[1]} / 100=${g.th[2]}</p><p class=muted>数字は言わない。たとえで表現して、全員で小さい順を決める。</p>${nextBtn('並びが決まった')}`)}
  pass(i,'ならべ酒場',()=>{S.cb=()=>itoLoop(i+1);go(`<p class=k>${g.th[0]}(1=${g.th[1]} / 100=${g.th[2]})</p><h2>あなたの数字</h2><div class=big>${g.nums[i]}</div>${nextBtn('覚えた(伏せる)')}`)});
}
function itoOrder(){

/* ================= online mode: each person plays on their own phone =================
   Host-authoritative: the host phone runs the game exactly as offline. Screens go out over a public MQTT relay:
   public ones to everybody, secret ones only to the one player's phone (everyone else sees "◯◯が操作中").
   Taps come back to the host, which checks who may press what. */
const NET={on:false,host:false,room:null,code:'',phase:'',ep:0,seq:0,roster:[],me:-1,cur:null,proxy:new Set(),last:{all:null,priv:null},shownKey:'',err:''};
function mqttRoom(){
  const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
  return{join:name=>new Promise((resolve,reject)=>{
    const id=Math.random().toString(36).slice(2,10),base='dokuro-saloon-bar/'+name+'/',state=new Map(),hs=new Set(),cs=[],subs=new Map(),seen=new Set();
    let done=false,cur={},tp=0,failed=0,lastErr='',to=0,hb=0;
    const fire=()=>hs.forEach(h=>{try{h({})}catch(e){}});
    const push=()=>{const pl=JSON.stringify({p:cur,t:Date.now()});cs.forEach(o=>{if(o.up)try{o.m.publish(base+'p/'+id,pl,{retain:true,qos:0})}catch(e){}})};
    const bad=e=>{lastErr=(e&&e.message)||String(e);if(!done&&++failed>=BROKERS.length){done=true;clearTimeout(to);reject(new Error(lastErr))}};
    const api={
      id,
      peers:()=>[...state].map(([p,x])=>({peer:p,sameTab:p===id,isMe:p===id,presence:x.presence,updatedAt:x.upd})),
      presence:async patch=>{
        cur={...cur};for(const [k,v] of Object.entries(patch)){if(v===null)delete cur[k];else cur[k]=v}
        state.set(id,{presence:cur,upd:Date.now()});
        if(!tp)tp=setTimeout(()=>{tp=0;push()},100);
        fire();
      },
      onPeers:h=>{hs.add(h);setTimeout(()=>h({}),1);return()=>hs.delete(h)},
      connected:()=>cs.some(o=>o.up),
      sub:(suffix,h)=>{if(!subs.has(suffix))subs.set(suffix,new Set());subs.get(suffix).add(h);cs.forEach(o=>{if(o.up)try{o.m.subscribe(base+suffix,{qos:1})}catch(e){}})},
      pub:(suffix,obj,retain)=>{obj.mid=obj.mid||id+'.'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const pl=JSON.stringify(obj);cs.forEach(o=>{if(o.up)try{o.m.publish(base+suffix,pl,{retain:!!retain,qos:1})}catch(e){}})},
      clear:suffix=>cs.forEach(o=>{if(o.up)try{o.m.publish(base+suffix,'',{retain:true,qos:1})}catch(e){}}),
      leave:async()=>{clearInterval(hb);clearTimeout(tp);cs.forEach(o=>{try{o.m.publish(base+'p/'+id,'',{retain:true});o.m.end(true)}catch(e){}})}
    };
    BROKERS.forEach((url,i)=>{
      const o={m:null,up:false};cs.push(o);
      try{
        const m=o.m=mqtt.connect(url,{clientId:'dkb_'+id+'_'+i,clean:true,reconnectPeriod:3000,connectTimeout:8000,keepalive:20,will:{topic:base+'p/'+id,payload:'',retain:true,qos:0}});
        m.on('connect',()=>{m.subscribe(base+'p/+',{qos:0},err=>{
          if(err)return bad(err);
          subs.forEach((_,suffix)=>m.subscribe(base+suffix,{qos:1}));
          o.up=true;state.set(id,{presence:cur,upd:Date.now()});push();
          if(!done){done=true;clearTimeout(to);resolve(api)}fire()})});
        m.on('close',()=>{o.up=false;fire()});
        m.on('error',bad);
        m.on('message',(topic,buf)=>{
          const rest=topic.slice(base.length);
          if(rest.startsWith('p/')){const pid=rest.slice(2);if(pid===id)return;
            if(!buf.length){if(state.delete(pid))fire();return}
            try{const m2=JSON.parse(buf.toString());state.set(pid,{presence:m2.p||{},upd:Date.now()});fire()}catch(e){}return}
          if(!buf.length)return;
          let msg;try{msg=JSON.parse(buf.toString())}catch(e){return}
          if(msg.mid){if(seen.has(msg.mid))return;seen.add(msg.mid);if(seen.size>3000)seen.clear()}
          const hsub=subs.get(rest);if(hsub)hsub.forEach(h=>{try{h(msg)}catch(e){}});
        });
      }catch(e){bad(e)}
    });
    to=setTimeout(()=>{if(!done){done=true;reject(new Error(lastErr||'timeout'))}},10000);
    hb=setInterval(()=>{push();const now=Date.now();let ch=false;state.forEach((x,k)=>{if(k!==id&&now-x.upd>12000){state.delete(k);ch=true}});if(ch)fire()},3000);
  })};
}
const pidOf=i=>NET.roster[i];
const waitHtml=i=>`<p class=k>オンライン</p><h2>${nm(i)}が操作中</h2><p class=muted>この画面は本人のスマホにだけ表示される。しばらく待つ。</p>`;
/* host: publish a screen. aud = 'all' | player index | 'each' (every phone gets its own part) */
function netShow(aud,html,o={}){
  const seq=++NET.seq,mk=m=>({ep:NET.ep,seq,roster:NET.roster,...m}),room=NET.room;
  const wait=o.wait||(typeof aud==='number'?waitHtml(aud):'');
  const cur=NET.cur={seq,aud,html,w:o.w||null,cb:o.cb||null,each:o.each||null,done:new Set(),res:{},expect:(o.expect||(o.each?Object.keys(o.each).filter(k=>o.each[k].w).map(Number):null)),wait};
  if(aud==='all')room.pub('s/all',mk({aud,html}),true);
  else if(aud==='each'){room.pub('s/all',mk({aud,html:wait}),true);Object.keys(o.each).forEach(i=>room.pub('s/'+pidOf(i),mk({aud,html:o.each[i].html||'',w:o.each[i].w||null}),true))}
  else{room.pub('s/all',mk({aud,html:wait}),true);room.pub('s/'+pidOf(aud),mk({aud,html,w:o.w||null}),true)}
  netHostView();
}
const netShowEach=(each,o)=>netShow('each','',{each,wait:o.wait,cb:o.cb,expect:o.expect});
function netHostView(){
  const c=NET.cur,i=NET.me;
  if(c.aud==='each'&&c.each[i])return showMsg({html:c.each[i].html||'',w:c.each[i].w});
  if(c.aud==='all'||c.aud===i||(typeof c.aud==='number'&&NET.proxy.has(c.aud)))return showMsg({html:c.html,w:c.w});
  showMsg({html:c.wait+(typeof c.aud==='number'?`<button class="alt sm" data-act=proxy data-i=${c.aud}>代行する(このスマホで操作)</button>`:'')});
}
function showMsg(m){
  if(m.w){render(m.html||'');runW(m.w.name,m.w.params,res=>netDone(res))}
  else render(m.html);
}
function netDone(res){
  if(NET.host){const c=NET.cur,as=(typeof c.aud==='number'&&NET.proxy.has(c.aud))?c.aud:NET.me;netHandle(pidOf(0),{ep:NET.ep,sid:c.seq,act:'wdone',data:res},as)}
  else NET.room.pub('a/host',{from:NET.room.id,ep:NET.ep,sid:NET.cur.seq,act:'wdone',data:res});
}
const OWN={mview:'i',mdone:'i',macc:'i',card:'i',mok:'i'};
function allowed(act,i,d){
  if(act in OWN)return +d[OWN[act]]===i;
  if(act==='nom')return i===S.g.win;
  if(act==='dnom')return i===S.g.a;
  if(act==='cardt')return !!S.use&&i===S.use.i;
  if(act==='matgt'||act==='mguess')return i===S.acc;
  if(act==='end'||act==='reset'||act==='netlobby')return i===0;
  return true;
}
function netWDone(i,res){
  const c=NET.cur;
  if(c.aud==='each'){if(!c.each[i]||!c.each[i].w||c.done.has(i))return;c.done.add(i);c.res[i]=res;if((c.expect||[]).every(k=>c.done.has(k))){const cb=c.cb;c.cb=null;cb&&cb(c.res)}return}
  if(c.aud===i&&c.cb){const cb=c.cb;c.cb=null;cb(res)}
}
function netHandle(pid,m,as){
  const c=NET.cur;if(!c||m.ep!==NET.ep||m.sid!==c.seq)return;
  const i=as!==undefined?as:NET.roster.indexOf(pid);if(i<0)return;
  if(m.act==='wdone')return netWDone(i,m.data);
  if(m.act==='proxy'){if(i!==0)return;NET.proxy.add(+m.data.i);return netHostView()}
  if(c.aud==='each')return;
  if(typeof c.aud==='number'&&c.aud!==i)return;

function netClick(act,data){

  else if(NET.cur)NET.room.pub('a/host',{from:NET.room.id,ep:NET.ep,sid:NET.cur.seq,act,data});

/* client: pick the newest screen addressed to me, else the public one */
function netIn(kind,m){
  if(!m||m.ep===undefined||NET.host)return;
  if(m.ep<NET.ep)return;
  if(m.ep>NET.ep){NET.ep=m.ep;NET.last={all:null,priv:null};NET.shownKey=''}
  NET.last[kind]=m;
  const a=NET.last.all,p=NET.last.priv;let pk=a;if(p&&(!a||p.seq>=a.seq))pk=p;if(!pk)return;
  const key=pk.seq+(pk===p?'p':'a');if(NET.shownKey===key)return;
  if(pk.kind==='lobby'){NET.shownKey=key;NET.on=false;NET.phase='lobby';return renderNetLobby()}
  if(!NET.on){if(!(pk.roster&&pk.roster.includes(NET.room.id)))return;NET.on=true;NET.host=false;NET.phase='game'}
  NET.shownKey=key;NET.roster=pk.roster;NET.me=pk.roster.indexOf(NET.room.id);NET.cur={seq:pk.seq};
  showMsg(pk);
}

async function netEnter(code,host,name){
  if(!window.mqtt)return;
  try{NET.room=await mqttRoom().join('bar-'+code)}catch(e){render($('#app').innerHTML+`<p class=muted>入室に失敗しました: ${esc((e&&e.message)||e)}</p>`);return}
  NET.code=code;NET.host=host;NET.phase='lobby';NET.on=false;NET.ep=0;NET.seq=0;NET.last={all:null,priv:null};NET.shownKey='';NET.proxy=new Set();
  NET.room.presence({bar:1,name,t:Date.now(),host});

  else{NET.room.sub('s/all',m=>netIn('all',m));NET.room.sub('s/'+NET.room.id,m=>netIn('priv',m))}

function renderNetLobby(){
  if(!NET.room)return;

  <div class=card>${ps.map(p=>`<div class=pl><span>${esc(p.presence.name||'?')}${p.presence.host?'(幹事)':''}</span><span>${p.sameTab?'あなた':''}</span></div>`).join('')||'<p class=muted>接続中…</p>'}</div>
  ${NET.host?`<button data-act=netstart ${ps.length<2?'disabled':''}>${ps.length<2?'2人以上で開始できる':'この人数で始める'}</button>`:'<p class=muted>幹事が始めるまで待機…</p>'}
  <p class=muted>接続:${NET.room.connected()?'OK':'NG'} / ${ps.length}人</p><button class=alt data-act=netleave>部屋を出る</button>`);

async function netLeave(){
